# Simple workflow for deploying static content to GitHub Pages
name: Deploy Dragon Gaming Asset Hosting

on:
  # Runs on pushes targeting the default branch
  push:
   branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment1.outputs.page_url || steps.deployment2.outputs.page_url }}
    runs-on: ubuntu-latest
    # Fail fast instead of burning the 6-hour runner default; with
    # cancel-in-progress: false a stuck run would otherwise block every
    # subsequent deployment queued behind it in the "pages" group.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Only the tree at HEAD is deployed; the full history of this
          # repo is large and just slows the run down.
          fetch-depth: 1
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Repo plumbing stays in the repository but must not ship to the site.
      # Keep this list in sync with the removal step in sync-assets-catalog.yml.
      - name: Remove non-site files from the deploy tree
        run: rm -rf scripts .github .gitignore .git
      # Catalog metadata is needed by the asset sync tooling, but must not be
      # published with the game files. Delete it only in this temporary runner
      # checkout; nothing is committed back to the repository.
      - name: Remove catalog metadata from the deploy tree
        run: |
          find . -type f \( -name 'game.json' -o -iname '*.md' \) -delete
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      # GitHub Pages enforces a 10-minute deployment limit and a 1GB
      # recommended ceiling; this site sits near the ceiling, so a
      # deployment occasionally times out. Retry once before giving up.
      - name: Deploy to GitHub Pages
        id: deployment1
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before retry
        if: steps.deployment1.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (retry)
        id: deployment2
        if: steps.deployment1.outcome == 'failure'
        uses: actions/deploy-pages@v5
