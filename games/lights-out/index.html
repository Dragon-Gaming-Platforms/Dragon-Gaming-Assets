<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Lights Out</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(circle at 50% 0,#1a1030,#080611 60%);color:#e9e6ff;
    font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;display:flex;flex-direction:column;
    align-items:center;justify-content:center;min-height:100vh;gap:14px;padding:14px;user-select:none;-webkit-user-select:none}
  h1{margin:0;font-size:clamp(20px,5vw,30px)}
  .hud{display:flex;gap:12px;font-weight:700}
  .hud div{background:rgba(255,255,255,.08);border-radius:10px;padding:8px 14px}
  #grid{display:grid;gap:8px;padding:10px;background:#0f0a1e;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.55);width:min(90vw,60vh,400px)}
  .cell{aspect-ratio:1;border-radius:10px;cursor:pointer;background:#241a3d;transition:background .12s, box-shadow .12s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
  .cell.on{background:radial-gradient(circle at 40% 35%,#ffe98a,#ffb020);box-shadow:0 0 18px rgba(255,190,60,.65)}
  #win{min-height:22px;color:#ffd76a;font-weight:700}
  .row{display:flex;gap:10px;align-items:center}
  button,select{background:#a68cff;color:#160d2b;border:0;border-radius:10px;padding:10px 18px;font-size:15px;font-weight:800;cursor:pointer}
  select{background:rgba(255,255,255,.1);color:#e9e6ff}
</style>
</head>
<body>
<h1>Lights Out</h1>
<div class="hud"><div>Moves <span id="moves">0</span></div><div>Lit <span id="lit">0</span></div></div>
<div id="grid"></div>
<div id="win">Turn every light off.</div>
<div class="row">
  <button id="newGame">New Puzzle</button>
  <select id="size"><option value="4">4×4</option><option value="5" selected>5×5</option><option value="6">6×6</option></select>
</div>
<script>
const gridEl=document.getElementById('grid');
let N,state,moves,solved;
function newGame(){
  N=parseInt(document.getElementById('size').value);
  state=Array.from({length:N},()=>Array(N).fill(false));
  moves=0;solved=false;
  // generate solvable puzzle by applying random presses from a solved board
  gridEl.style.gridTemplateColumns=`repeat(${N},1fr)`;
  const presses=N*N;
  for(let k=0;k<presses;k++){if(Math.random()<0.5)toggle(Math.floor(Math.random()*N),Math.floor(Math.random()*N),false);}
  if(allOff())toggle(0,0,false); // avoid starting solved
  moves=0;render();
  document.getElementById('moves').textContent=0;
  document.getElementById('win').textContent='Turn every light off.';
}
function toggle(r,c,count){
  [[0,0],[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr,dc])=>{const rr=r+dr,cc=c+dc;
    if(rr>=0&&cc>=0&&rr<N&&cc<N)state[rr][cc]=!state[rr][cc];});
  if(count){moves++;document.getElementById('moves').textContent=moves;}
}
function press(r,c){
  if(solved)return;
  toggle(r,c,true);render();
  if(allOff()){solved=true;document.getElementById('win').textContent=`🎉 Solved in ${moves} moves!`;}
}
function allOff(){return state.every(row=>row.every(v=>!v));}
function render(){
  gridEl.innerHTML='';let lit=0;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const d=document.createElement('div');d.className='cell'+(state[r][c]?' on':'');
    if(state[r][c])lit++;
    d.onclick=()=>press(r,c);gridEl.appendChild(d);
  }
  document.getElementById('lit').textContent=lit;
}
document.getElementById('newGame').onclick=newGame;
document.getElementById('size').onchange=newGame;
newGame();
</script>
</body>
</html>
