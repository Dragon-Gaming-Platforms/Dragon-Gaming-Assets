<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OVERDRIVE - Neon Arcade Dodger</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 24px;
            text-shadow: 0 0 10px #0ff;
            pointer-events: none;
        }
        #gameover {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #f0f;
            font-size: 40px;
            text-shadow: 0 0 15px #f0f;
            display: none;
            pointer-events: none;
        }
        #start-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            font-size: 24px;
            text-shadow: 0 0 10px #0ff;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui">SCORE: <span id="score">0</span></div>
    
    <div id="start-screen">
        <h1>OVERDRIVE</h1>
        <p>TAP OR PRESS SPACE TO START</p>
    </div>

    <div id="gameover">
        <h1>GAME OVER</h1>
        <p>PRESS SPACE TO RESTART</p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let gameStarted = false;
        let gameOver = false;
        let score = 0;
        let obstacles = [];
        let particles = [];
        let gridOffset = 0;

        const player = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            size: 20,
            speed: 7,
            color: '#0ff'
        };

        const keys = {
            left: false,
            right: false,
            up: false,
            down: false
        };

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                if (!gameStarted || gameOver) {
                    resetGame();
                    gameStarted = true;
                }
            }
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = true;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = false;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
        });

        window.addEventListener('click', () => {
            if (!gameStarted || gameOver) {
                resetGame();
                gameStarted = true;
            }
        });

        function resetGame() {
            score = 0;
            obstacles = [];
            particles = [];
            player.x = canvas.width / 2;
            player.y = canvas.height - 100;
            gameOver = false;
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('gameover').style.display = 'none';
        }

        class Obstacle {
            constructor() {
                this.width = Math.random() * 60 + 40;
                this.height = 20;
                this.x = Math.random() * (canvas.width - this.width);
                this.y = -this.height;
                this.speed = Math.random() * 3 + 4 + score * 0.05;
                this.color = '#f0f';
            }

            update() {
                this.y += this.speed;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.shadowBlur = 0;
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6;
                this.size = Math.random() * 4 + 1;
                this.color = color;
                this.life = 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.02;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.15)';
            ctx.lineWidth = 1;
            gridOffset = (gridOffset + 2) % 40;

            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = gridOffset; y < canvas.height; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawGrid();

            if (gameStarted && !gameOver) {
                // Player movement
                if (keys.left && player.x > 0) player.x -= player.speed;
                if (keys.right && player.x < canvas.width - player.size) player.x += player.speed;
                if (keys.up && player.y > 0) player.y -= player.speed;
                if (keys.down && player.y < canvas.height - player.size) player.y += player.speed;

                // Trail effect
                particles.push(new Particle(player.x + player.size / 2, player.y + player.size, player.color));

                // Spawn obstacles
                if (Math.random() < 0.05) {
                    obstacles.push(new Obstacle());
                }

                score++;
                document.getElementById('score').innerText = score;
            }

            // Draw player
            if (!gameOver) {
                ctx.fillStyle = player.color;
                ctx.shadowBlur = 20;
                ctx.shadowColor = player.color;
                ctx.fillRect(player.x, player.y, player.size, player.size);
                ctx.shadowBlur = 0;
            }

            // Update & Draw obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].update();
                obstacles[i].draw();

                // Collision detection
                if (
                    player.x < obstacles[i].x + obstacles[i].width &&
                    player.x + player.size > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height &&
                    player.y + player.size > obstacles[i].y
                ) {
                    gameOver = true;
                    document.getElementById('gameover').style.display = 'block';

                    // Explosion effect
                    for (let j = 0; j < 30; j++) {
                        particles.push(new Particle(player.x, player.y, '#f0f'));
                    }
                }

                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                }
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
