<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Falling Sand Lab</title>
  <style>
    body{margin:0;background:#0b0e14;color:#c7d0dd;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}
    header{display:flex;align-items:baseline;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #1d2431}
    h1{font:700 15px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;letter-spacing:.42em;text-transform:uppercase;background:linear-gradient(90deg,#ffd86b,#ff9e2c 55%,#ff5a13);-webkit-background-clip:text;background-clip:text;color:transparent}
    #stage{flex:1 1 auto;position:relative;min-height:0;overflow:hidden;background:#0d1017}
    #cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;image-rendering:pixelated}
    #toolbar{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 14px 8px;border-top:1px solid #1d2431;background:#0d1118}
    .brush{display:flex;align-items:center;gap:8px;color:#5c6773;font-size:12px}
    .brush input{width:110px;accent-color:#ff9e2c}
    .mat{display:flex;align-items:center;gap:7px;padding:6px 9px;background:#151a24;border:1px solid #232b3a;border-radius:8px;color:#c7d0dd;font-size:12px;cursor:pointer}
    .mat:hover{background:#1a2231;border-color:#2e3a4f}
    .mat.sel{border-color:#ff9e2c;box-shadow:0 0 0 1px #ff9e2c,0 0 16px -2px #ff9e2c;background:#1a2030}
    .mat .sw{width:13px;height:13px;border-radius:4px;background:#ff9e2c;box-shadow:inset 0 -3px 6px rgba(0,0,0,.45),0 0 6px -1px #ff9e2c}
    .act{padding:7px 12px;background:#151a24;border:1px solid #232b3a;border-radius:8px;color:#c7d0dd;font-size:12px;cursor:pointer}
    .act:hover{background:#1a2231;border-color:#2e3a4f}
    .act.on{border-color:#ff9e2c;color:#ff9e2c;box-shadow:0 0 0 1px #ff9e2c,0 0 14px -4px #ff9e2c}
    #hint{order:99;flex-basis:100%;color:#48515f;font-size:11px;padding-top:6px;letter-spacing:.02em}
  </style>
</head>
<body>
  <header>
    <div class="brand"><h1>Falling Sand Lab</h1></div>
    <div class="stats"><span><b id="fps">--</b> fps</span><span><b id="count">0</b> particles</span></div>
  </header>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="toolbar">
    <label class="brush">brush <input id="brush" type="range" min="1" max="14" value="3"><b id="brushv">3</b></label>
    <div id="mats"></div>
    <select id="preset" class="act" title="scenes">
      <option value="garden">scene: garden</option>
      <option value="volcano">scene: volcano</option>
      <option value="waterfall">scene: waterfall</option>
      <option value="blank">scene: blank</option>
    </select>
    <button id="rain" class="act" title="toggle rain (R)">rain</button>
    <button id="pause" class="act" title="pause (space)">pause</button>
    <button id="shot" class="act" title="download a snapshot">save png</button>
    <button id="clear" class="act danger" title="clear (C)">clear</button>
    <div id="hint">drag to draw · right-drag to erase · 1–9,0 materials · [ ] brush size · space pause · R rain · C clear · you can draw while paused</div>
  </div>
  <script>
    'use strict';
    const EMPTY=0,WALL=1,WOOD=2,PLANT=3,ICE=4,SAND=5,GUNPOWDER=6,WATER=7,OIL=8,ACID=9,LAVA=10,FIRE=11,STEAM=12,SMOKE=13;
    const INFO=[
      {name:'eraser',key:'0',color:'#242c3a',cat:'TOOL'},
      {name:'stone',key:'1',color:'#5b6472',cat:'STATIC',density:9},
      {name:'wood',key:'2',color:'#7a5633',cat:'STATIC',density:9,flammable:.05},
      {name:'plant',key:'3',color:'#46a04c',cat:'STATIC',density:9,flammable:.22},
      {name:'ice',key:'4',color:'#bfe3f2',cat:'STATIC',density:9},
      {name:'sand',key:'5',color:'#d9b166',cat:'POWDER',density:6},
      {name:'gunpowder',key:'6',color:'#4a5058',cat:'POWDER',density:6,explosive:true},
      {name:'water',key:'7',color:'#2f7bd6',cat:'LIQUID',density:3,disp:5},
      {name:'oil',key:'8',color:'#5a4526',cat:'LIQUID',density:2,disp:3,flammable:.45},
      {name:'acid',key:'9',color:'#69c92e',cat:'LIQUID',density:3,disp:4,acid:true},
      {name:'lava',key:'10',color:'#ff5a13',cat:'LIQUID',density:3,disp:1,viscous:true,hot:true},
      {name:'fire',key:'11',color:'#ff9e2c',cat:'FIRECAT',density:0},
      {name:'steam',key:'12',color:'#a0d8ff',cat:'GAS',density:0},
      {name:'smoke',key:'13',color:'#606068',cat:'GAS',density:0}
    ];
    const canvas=document.getElementById('cv'),ctx=canvas.getContext('2d');
    let w=canvas.width=400,h=canvas.height=300,scale=2;
    canvas.style.width=w*scale+'px';canvas.style.height=h*scale+'px';
    const cells=new Uint8Array(w*h),tint=new Uint8Array(w*h),life=new Uint8Array(w*h);
    let brush=3,mat=SAND,pause=false,rain=false,fps=0,count=0,last=performance.now();
    function idx(x,y){return y*w+x}
    function set(x,y,m){const i=idx(x,y);cells[i]=m;tint[i]=(Math.random()*32)|0;life[i]=0}
    function clear(){cells.fill(EMPTY);tint.fill(0);life.fill(0);count=0}
    function draw(){
      const img=ctx.createImageData(w,h),data=img.data;
      for(let i=0;i<cells.length;i++){
        const m=cells[i],p=i*4;let r,g,b;
        if(m===FIRE){const age=life[i],heat=Math.max(0,1-age/50),f=((tint[i]+fps)%16)-8;r=Math.min(255,235+f);g=Math.min(255,90+heat*110+f);b=Math.min(255,20+heat*40)}
        else if(m===SMOKE){const age=life[i],fade=Math.max(0,1-age/160),v=40+fade*40;r=v;g=v;b=Math.min(255,v+6)}
        else{const base=INFO[m]||INFO[EMPTY],t=tint[i]-16;r=Math.min(255,base.color?parseInt(base.color.slice(1,3),16)+t:16+t);g=Math.min(255,base.color?parseInt(base.color.slice(3,5),16)+t:18+t);b=Math.min(255,base.color?parseInt(base.color.slice(5,7),16)+t:24+t)}
        data[p]=r;data[p+1]=g;data[p+2]=b;data[p+3]=255
      }
      ctx.putImageData(img,0,0)
    }
    function step(){
      if(pause)return;
      for(let y=h-1;y>=0;y--){
        const left=(fps&1)===0;
        for(let x=left?0:w-1;(left?x<w:x>=0);x+=left?1:-1){
          const m=cells[idx(x,y)];
          if(m===SAND){
            if(y+1<h&&cells[idx(x,y+1)]===EMPTY){cells[idx(x,y+1)]=SAND;cells[idx(x,y)]=EMPTY;continue}
            const dir=Math.random()<.5?-1:1;
            for(const dx of [dir,-dir]){const nx=x+dx;if(nx>=0&&nx<w&&y+1<h&&cells[idx(nx,y+1)]===EMPTY){cells[idx(nx,y+1)]=SAND;cells[idx(x,y)]=EMPTY;break}}
          }
          else if(m===WATER){
            if(y+1<h&&cells[idx(x,y+1)]===EMPTY){cells[idx(x,y+1)]=WATER;cells[idx(x,y)]=EMPTY;continue}
            const dir=Math.random()<.5?-1:1;
            for(const dx of [dir,-dir]){const nx=x+dx;if(nx>=0&&nx<w&&y+1<h&&cells[idx(nx,y+1)]===EMPTY){cells[idx(nx,y+1)]=WATER;cells[idx(x,y)]=EMPTY;break}}
          }
          else if(m===FIRE){life[idx(x,y)]++;if(life[idx(x,y)]>40)cells[idx(x,y)]=SMOKE}
        }
      }
      draw();fps++;const now=performance.now();if(now-last>1000){document.getElementById('fps').textContent=fps;fps=0;last=now}
      count=0;for(let i=0;i<cells.length;i++)if(cells[i]!==EMPTY)count++;document.getElementById('count').textContent=count
    }
    function init(){
      clear();
      for(let i=0;i<INFO.length;i++){
        const m=document.createElement('div');m.className='mat'+(i===SAND?' sel':'');m.innerHTML='<span class="sw" style="background:'+INFO[i].color+'"></span>'+INFO[i].name;m.onclick=()=>{(document.querySelectorAll('.mat')).forEach(e=>e.classList.remove('sel'));m.classList.add('sel');mat=i};document.getElementById('mats').appendChild(m)
      }
      document.getElementById('brush').oninput=e=>{(document.getElementById('brushv').textContent=e.target.value);brush=parseInt(e.target.value)}
      document.getElementById('pause').onclick=()=>(pause=!pause,document.getElementById('pause').textContent=pause?'▶ Resume':'⏸ Pause')
      document.getElementById('clear').onclick=clear
      document.getElementById('rain').onclick=()=>(rain=!rain)
      document.getElementById('preset').onchange=e=>{(clear());
        if(e.target.value==='garden'){for(let i=0;i<20;i++)set(Math.random()*w|0,h-10,PLANT);for(let i=0;i<10;i++)set(Math.random()*w|0,h-20,SAND)}
        else if(e.target.value==='volcano'){for(let i=0;i<5;i++)set(w/2+Math.random()*20|0,h-20,LAVA)}
        else if(e.target.value==='waterfall'){for(let i=0;i<10;i++)set(w/2+Math.random()*20|0,10,WATER)}
      }
      let mx=-1,my=-1,md=false;
      canvas.onmousedown=e=>{(md=true);mx=e.offsetX/scale|0;my=e.offsetY/scale|0;set(mx,my,mat)}
      canvas.onmousemove=e=>{(md&&Math.abs(e.offsetX/scale|0-mx)>0||Math.abs(e.offsetY/scale|0-my)>0)&&(mx=e.offsetX/scale|0,my=e.offsetY/scale|0,set(mx,my,mat))}
      canvas.onmouseup=()=>md=false;canvas.oncontextmenu=e=>e.preventDefault()
      document.onkeydown=e=>{(e.code==='Space'&&!e.repeat)&&(pause=!pause,document.getElementById('pause').textContent=pause?'▶ Resume':'⏸ Pause');(e.code==='KeyR'&&!e.repeat)&&(rain=!rain);(e.code==='KeyC'&&!e.repeat)&&clear()}
      setInterval(()=>step(),16)
    }
    init()
  </script>
</body>
</html>
