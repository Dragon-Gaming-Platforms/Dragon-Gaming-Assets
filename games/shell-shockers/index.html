<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Shell Shockers</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#0b0f18;overflow:hidden;
    font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;color:#e8eefc}
  #frame{border:0;display:block;width:100%;height:100%}
  /* Loading / fallback overlay */
  #cover{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;text-align:center;padding:24px;background:radial-gradient(circle at 50% 20%,#16233f,#0b0f18 65%);z-index:5}
  #cover.hide{display:none}
  #cover h1{margin:0;font-size:clamp(24px,6vw,40px);letter-spacing:1px}
  #cover p{margin:0;max-width:520px;line-height:1.5;opacity:.85}
  .egg{font-size:56px;animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(6deg)}}
  .btn{background:#ffd23f;color:#3a2a00;border:0;border-radius:12px;padding:14px 30px;font-size:18px;
    font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}
  .btn:active{transform:translateY(1px)}
  .spinner{width:34px;height:34px;border:4px solid rgba(255,255,255,.2);border-top-color:#ffd23f;border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .small{font-size:13px;opacity:.6}
</style>
</head>
<body>
<!-- Loading / fallback cover shown until the official game loads -->
<div id="cover">
  <div class="egg">🥚</div>
  <h1>Shell Shockers</h1>
  <div class="spinner" id="spin"></div>
  <p id="msg">Loading the official Shell Shockers game…</p>
  <a class="btn" id="openTab" href="https://shellshock.io/" target="_blank" rel="noopener">Open game in a new tab ↗</a>
  <p class="small">Shell Shockers is a live multiplayer game served by its official servers at shellshock.io. Nothing is copied or hosted here — this page just launches the real game.</p>
</div>

<iframe
  id="frame"
  src="https://shellshock.io/"
  title="Shell Shockers"
  referrerpolicy="origin"
  allow="autoplay; fullscreen; gamepad; pointer-lock; clipboard-write"
  allowfullscreen
  sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-pointer-lock allow-orientation-lock"></iframe>

<script>
  var cover=document.getElementById('cover');
  var frame=document.getElementById('frame');
  var spin=document.getElementById('spin');
  var msg=document.getElementById('msg');
  var loaded=false;

  frame.addEventListener('load',function(){
    loaded=true;
    // Give the game a moment to paint, then reveal it.
    setTimeout(function(){cover.classList.add('hide');},1200);
  });

  // If the official site refuses to be embedded (X-Frame-Options / CSP),
  // the iframe stays blank. After a grace period, switch the cover into a
  // clear "play in a new tab" fallback instead of leaving the user stuck.
  setTimeout(function(){
    if(!loaded){
      spin.style.display='none';
      msg.innerHTML='The game could not be embedded here (the official site blocks framing on some browsers). Use the button below to play it directly.';
    }
  },6000);
</script>
</body>
</html>
