<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Whack-a-Mole</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(circle at 50% 0,#2b6f3a,#0f2a17 60%);color:#fff;
    font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;display:flex;flex-direction:column;
    align-items:center;justify-content:center;min-height:100vh;gap:14px;padding:14px;user-select:none;-webkit-user-select:none}
  h1{margin:0;font-size:clamp(22px,5vw,32px)}
  .hud{display:flex;gap:14px;font-size:18px;font-weight:700}
  .hud div{background:rgba(0,0,0,.28);border-radius:10px;padding:8px 16px}
  #grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:min(92vw,420px)}
  .hole{aspect-ratio:1;background:radial-gradient(ellipse at 50% 78%,#3a2413 0 46%,transparent 47%),
    radial-gradient(circle at 50% 35%,#5a8f3c,#2f5a22);border-radius:16px;position:relative;overflow:hidden;cursor:pointer;
    box-shadow:inset 0 -8px 16px rgba(0,0,0,.4)}
  .mole{position:absolute;left:15%;width:70%;bottom:-70%;transition:bottom .12s ease-out;
    background:radial-gradient(circle at 40% 30%,#b98a5e,#6b4423);border-radius:50% 50% 46% 46%;aspect-ratio:1}
  .mole::before,.mole::after{content:"";position:absolute;top:34%;width:12%;height:12%;background:#1c120a;border-radius:50%}
  .mole::before{left:30%}.mole::after{left:58%}
  .mole .nose{position:absolute;top:52%;left:44%;width:12%;height:9%;background:#d67c8a;border-radius:50%}
  .up .mole{bottom:6%}
  .bonk{filter:brightness(1.6) saturate(1.4)}
  .dirt{position:absolute;bottom:0;left:0;right:0;height:34%;background:linear-gradient(#3a2413,#241305);border-radius:0 0 16px 16px;z-index:2}
  button{background:#ffd76a;color:#3a2610;border:0;border-radius:12px;padding:12px 28px;font-size:18px;font-weight:800;cursor:pointer}
  #over{font-size:18px;min-height:24px;color:#ffd76a;font-weight:700}
</style>
</head>
<body>
<h1>Whack-a-Mole</h1>
<div class="hud"><div>Score <span id="score">0</span></div><div>Time <span id="time">30</span>s</div><div>Best <span id="best">0</span></div></div>
<div id="grid"></div>
<div id="over"></div>
<button id="start">Start</button>
<script>
const grid=document.getElementById('grid');
const holes=[];let score,timeLeft,running,timers=[],tick,best=0;
for(let i=0;i<9;i++){
  const h=document.createElement('div');h.className='hole';
  h.innerHTML='<div class="mole"><div class="nose"></div></div><div class="dirt"></div>';
  h.addEventListener('pointerdown',()=>whack(i));
  grid.appendChild(h);holes.push(h);
}
function whack(i){
  if(!running)return;
  const h=holes[i];
  if(h.classList.contains('up')&&!h.dataset.hit){
    h.dataset.hit='1';score++;document.getElementById('score').textContent=score;
    h.querySelector('.mole').classList.add('bonk');
    setTimeout(()=>{h.classList.remove('up');h.querySelector('.mole').classList.remove('bonk');delete h.dataset.hit;},90);
  }
}
function popRandom(){
  if(!running)return;
  const free=holes.map((h,i)=>i).filter(i=>!holes[i].classList.contains('up'));
  if(free.length){
    const i=free[Math.floor(Math.random()*free.length)];
    const h=holes[i];h.classList.add('up');delete h.dataset.hit;
    const stay=Math.max(500,1100-score*12);
    setTimeout(()=>{h.classList.remove('up');},stay);
  }
  const next=Math.max(280,850-score*10);
  timers.push(setTimeout(popRandom,next));
}
function start(){
  score=0;timeLeft=30;running=true;
  document.getElementById('score').textContent=0;
  document.getElementById('time').textContent=30;
  document.getElementById('over').textContent='';
  document.getElementById('start').textContent='Restart';
  holes.forEach(h=>h.classList.remove('up'));
  clearInterval(tick);timers.forEach(clearTimeout);timers=[];
  popRandom();popRandom();
  tick=setInterval(()=>{
    timeLeft--;document.getElementById('time').textContent=timeLeft;
    if(timeLeft<=0)end();
  },1000);
}
function end(){
  running=false;clearInterval(tick);timers.forEach(clearTimeout);
  holes.forEach(h=>h.classList.remove('up'));
  best=Math.max(best,score);document.getElementById('best').textContent=best;
  document.getElementById('over').textContent=`⏱ Time! You whacked ${score} moles.`;
}
document.getElementById('start').onclick=start;
</script>
</body>
</html>
