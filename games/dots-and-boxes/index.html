<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Dots and Boxes</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(circle at 50% 0,#12314a,#08131f 60%);color:#eef;
    font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;display:flex;flex-direction:column;
    align-items:center;justify-content:center;min-height:100vh;gap:12px;padding:12px;user-select:none;-webkit-user-select:none}
  h1{margin:0;font-size:clamp(20px,5vw,30px)}
  .scores{display:flex;gap:14px}
  .score{background:rgba(255,255,255,.08);border-radius:10px;padding:8px 16px;font-weight:700;text-align:center;min-width:96px}
  .score b{display:block;font-size:24px}
  .you b{color:#4fd1c5}.cpu b{color:#ff8a65}
  #status{min-height:22px;color:#ffd76a;font-weight:700}
  canvas{background:#0b1a2a;border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.5);touch-action:manipulation}
  .row{display:flex;gap:10px;align-items:center}
  button,select{background:#4fd1c5;color:#04231f;border:0;border-radius:10px;padding:10px 18px;font-size:15px;font-weight:800;cursor:pointer}
  select{background:rgba(255,255,255,.1);color:#eef}
</style>
</head>
<body>
<h1>Dots and Boxes</h1>
<div class="scores">
  <div class="score you">You<b id="you">0</b></div>
  <div class="score cpu">CPU<b id="cpu">0</b></div>
</div>
<div id="status">Your turn — draw a line</div>
<canvas id="cv"></canvas>
<div class="row">
  <button id="newGame">New Game</button>
  <select id="size"><option value="4">4×4</option><option value="5" selected>5×5</option><option value="6">6×6</option></select>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let G,gap,pad,H,V,owner,youScore,cpuScore,turn,over;
function init(){
  G=parseInt(document.getElementById('size').value);
  H=Array.from({length:G+1},()=>Array(G).fill(0)); // horizontal edges
  V=Array.from({length:G},()=>Array(G+1).fill(0));  // vertical edges
  owner=Array.from({length:G},()=>Array(G).fill(0));
  youScore=cpuScore=0;turn=1;over=false;
  document.getElementById('you').textContent=0;document.getElementById('cpu').textContent=0;
  document.getElementById('status').textContent='Your turn — draw a line';
  layout();
}
function layout(){
  const px=Math.min(window.innerWidth*0.9,window.innerHeight*0.55,460);
  gap=Math.floor((px-30)/G);pad=18;cv.width=cv.height=pad*2+gap*G;draw();
}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  // boxes
  for(let r=0;r<G;r++)for(let c=0;c<G;c++)if(owner[r][c]){
    ctx.fillStyle=owner[r][c]===1?'rgba(79,209,197,.28)':'rgba(255,138,101,.28)';
    ctx.fillRect(pad+c*gap+3,pad+r*gap+3,gap-6,gap-6);
    ctx.fillStyle=owner[r][c]===1?'#4fd1c5':'#ff8a65';ctx.font=`bold ${gap*0.4}px system-ui`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(owner[r][c]===1?'Y':'C',pad+c*gap+gap/2,pad+r*gap+gap/2);
  }
  // edges
  ctx.lineCap='round';
  for(let r=0;r<=G;r++)for(let c=0;c<G;c++){
    ctx.strokeStyle=H[r][c]?'#e8eefc':'rgba(255,255,255,.12)';ctx.lineWidth=H[r][c]?5:3;
    ctx.beginPath();ctx.moveTo(pad+c*gap,pad+r*gap);ctx.lineTo(pad+(c+1)*gap,pad+r*gap);ctx.stroke();
  }
  for(let r=0;r<G;r++)for(let c=0;c<=G;c++){
    ctx.strokeStyle=V[r][c]?'#e8eefc':'rgba(255,255,255,.12)';ctx.lineWidth=V[r][c]?5:3;
    ctx.beginPath();ctx.moveTo(pad+c*gap,pad+r*gap);ctx.lineTo(pad+c*gap,pad+(r+1)*gap);ctx.stroke();
  }
  // dots
  ctx.fillStyle='#9fb4d8';
  for(let r=0;r<=G;r++)for(let c=0;c<=G;c++){ctx.beginPath();ctx.arc(pad+c*gap,pad+r*gap,4,0,7);ctx.fill();}
}
function edgesList(){
  const e=[];
  for(let r=0;r<=G;r++)for(let c=0;c<G;c++)if(!H[r][c])e.push(['H',r,c]);
  for(let r=0;r<G;r++)for(let c=0;c<=G;c++)if(!V[r][c])e.push(['V',r,c]);
  return e;
}
function claim(type,r,c,player){
  if(type==='H')H[r][c]=1;else V[r][c]=1;
  let got=false;
  const check=(br,bc)=>{if(br<0||bc<0||br>=G||bc>=G||owner[br][bc])return;
    if(H[br][bc]&&H[br+1][bc]&&V[br][bc]&&V[br][bc+1]){owner[br][bc]=player;got=true;}};
  if(type==='H'){check(r-1,c);check(r,c);}else{check(r,c-1);check(r,c);}
  return got;
}
cv.addEventListener('click',e=>{
  if(over||turn!==1)return;
  const rect=cv.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(cv.width/rect.width),y=(e.clientY-rect.top)*(cv.height/rect.height);
  const edge=nearestEdge(x,y);if(!edge)return;
  const[type,r,c]=edge;
  if((type==='H'&&H[r][c])||(type==='V'&&V[r][c]))return;
  const got=claim(type,r,c,1);tally();draw();
  if(finished())return finish();
  if(!got){turn=2;document.getElementById('status').textContent='CPU thinking…';setTimeout(cpuTurn,300);}
  else document.getElementById('status').textContent='You completed a box — go again!';
});
function nearestEdge(x,y){
  let best=null,bd=gap*0.4;
  for(let r=0;r<=G;r++)for(let c=0;c<G;c++){const mx=pad+(c+0.5)*gap,my=pad+r*gap;const d=Math.hypot(x-mx,y-my);if(d<bd){bd=d;best=['H',r,c];}}
  for(let r=0;r<G;r++)for(let c=0;c<=G;c++){const mx=pad+c*gap,my=pad+(r+0.5)*gap;const d=Math.hypot(x-mx,y-my);if(d<bd){bd=d;best=['V',r,c];}}
  return best;
}
function boxSides(r,c){let n=0;if(H[r][c])n++;if(H[r+1][c])n++;if(V[r][c])n++;if(V[r][c+1])n++;return n;}
function edgeCompletes(type,r,c){
  // simulate
  let n=0;
  const test=(br,bc)=>{if(br<0||bc<0||br>=G||bc>=G)return;
    let s=boxSides(br,bc);
    // add this edge if it belongs to box
    if(type==='H'&&(r===br||r===br+1))s++;
    if(type==='V'&&(c===bc||c===bc+1))s++;
    if(s===4)n++;};
  if(type==='H'){test(r-1,c);test(r,c);}else{test(r,c-1);test(r,c);}
  return n>0;
}
function edgeGivesAway(type,r,c){
  // would this edge create a box with 3 sides (letting opponent take it)?
  const test=(br,bc)=>{if(br<0||bc<0||br>=G||bc>=G)return false;
    let s=boxSides(br,bc);
    if(type==='H'&&(r===br||r===br+1))s++;
    if(type==='V'&&(c===bc||c===bc+1))s++;
    return s===3;};
  let bad=false;
  if(type==='H'){bad=test(r-1,c)||test(r,c);}else{bad=test(r,c-1)||test(r,c);}
  return bad;
}
function cpuTurn(){
  if(over)return;
  let moved=false;
  while(!over){
    const edges=edgesList();
    // 1) complete a box if possible
    let pick=edges.find(([t,r,c])=>edgeCompletes(t,r,c));
    // 2) else safe move
    if(!pick){const safe=edges.filter(([t,r,c])=>!edgeGivesAway(t,r,c));
      if(safe.length)pick=safe[Math.floor(Math.random()*safe.length)];}
    // 3) else any move
    if(!pick)pick=edges[Math.floor(Math.random()*edges.length)];
    if(!pick)break;
    const got=claim(pick[0],pick[1],pick[2],2);tally();draw();
    if(finished()){finish();return;}
    if(!got){turn=1;document.getElementById('status').textContent='Your turn';return;}
    moved=true;
  }
}
function tally(){
  youScore=cpuScore=0;
  for(const row of owner)for(const v of row){if(v===1)youScore++;else if(v===2)cpuScore++;}
  document.getElementById('you').textContent=youScore;document.getElementById('cpu').textContent=cpuScore;
}
function finished(){return owner.every(row=>row.every(v=>v));}
function finish(){over=true;
  const m=youScore>cpuScore?'🎉 You win!':cpuScore>youScore?'CPU wins — try again':"It's a tie";
  document.getElementById('status').textContent=`Game over — ${m} (${youScore}–${cpuScore})`;}
document.getElementById('newGame').onclick=init;
document.getElementById('size').onchange=init;
window.addEventListener('resize',layout);
init();
</script>
</body>
</html>
