<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Mahjong Match</title>
<style>
  *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#123524;color:#eef;
    font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px;user-select:none;-webkit-user-select:none}
  h1{margin:2px 0;font-size:clamp(18px,5vw,26px)}
  #status{min-height:18px;font-weight:700;color:#ffe08a;text-align:center}
  #wrap{position:relative;width:330px;height:340px;margin:0 auto}
  .tile{position:absolute;width:34px;height:44px;border-radius:6px;background:linear-gradient(#fffef2,#e6e2c8);
    border:1px solid #b7b18a;box-shadow:1px 1px 0 #8a8560,2px 2px 3px rgba(0,0,0,.4);
    display:flex;align-items:center;justify-content:center;font-size:20px;cursor:default}
  .tile.free{cursor:pointer}
  .tile.free:hover{background:linear-gradient(#fffde0,#f2eec8)}
  .tile.sel{outline:3px solid #ffd000;outline-offset:0;z-index:999!important}
  .tile.blocked{filter:brightness(.7)}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:14px}
  button{background:#ffcc33;color:#20150a;border:0;border-radius:9px;padding:8px 14px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<h1>Mahjong Match</h1>
<div id="status">Tap two identical free tiles to remove them. Clear the board!</div>
<div id="wrap"></div>
<div class="bar">
  <span>Tiles left: <b id="left">0</b></span>
  <button id="hint">Hint</button>
  <button id="shuffle">Shuffle</button>
  <button id="newg">New Board</button>
</div>
<script>
const PAL=['🐉','🌸','🎋','🍀','🀄','🎐','🏮','🌼','🍁','🐟','🦋','🐢','🔔','⭐','🌙','☀️','🍒','🌊','🎍','🦎'];
const wrap=document.getElementById('wrap');
let tiles,sel;
function layout(){ // pyramid: base 8x6, then 6x4, then 4x2
  const cells=[];
  const layers=[{w:8,h:6,x0:0,y0:0},{w:6,h:4,x0:1,y0:1},{w:4,h:2,x0:2,y0:2}];
  layers.forEach((L,z)=>{for(let yy=0;yy<L.h;yy++)for(let xx=0;xx<L.w;xx++)cells.push({x:L.x0+xx,y:L.y0+yy,z});});
  return cells;
}
function newBoard(){
  const cells=layout();const n=cells.length; // 48+24+8 = 80
  const K=n/4; // each symbol 4 times
  let syms=[];for(let i=0;i<K;i++){for(let j=0;j<4;j++)syms.push(PAL[i%PAL.length]);}
  // if K>PAL length, symbols repeat but still even counts -> fine
  for(let i=syms.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[syms[i],syms[j]]=[syms[j],syms[i]];}
  tiles=cells.map((c,i)=>({...c,sym:syms[i],removed:false,id:i}));
  sel=null;render();setStatus('Tap two identical free tiles to remove them.');
}
function at(x,y,z){return tiles.find(t=>!t.removed&&t.x===x&&t.y===y&&t.z===z);}
function isFree(t){
  if(t.removed)return false;
  if(at(t.x,t.y,t.z+1))return false; // covered
  const left=at(t.x-1,t.y,t.z),right=at(t.x+1,t.y,t.z);
  return !left||!right;
}
function render(){
  wrap.innerHTML='';
  const live=tiles.filter(t=>!t.removed).sort((a,b)=>a.z-b.z||a.y-b.y||a.x-b.x);
  live.forEach(t=>{const el=document.createElement('div');
    const free=isFree(t);
    el.className='tile'+(free?' free':' blocked')+(sel===t?' sel':'');
    el.style.left=(t.x*32+t.z*7)+'px';
    el.style.top=(t.y*40-t.z*7+8)+'px';
    el.style.zIndex=t.z*100+t.y*2+1;
    el.textContent=t.sym;
    if(free)el.onclick=()=>click(t);
    wrap.appendChild(el);});
  document.getElementById('left').textContent=tiles.filter(t=>!t.removed).length;
}
function setStatus(s){document.getElementById('status').textContent=s;}
function click(t){
  if(!isFree(t))return;
  if(sel===t){sel=null;render();return;}
  if(sel&&sel.sym===t.sym){sel.removed=true;t.removed=true;sel=null;render();
    if(tiles.every(x=>x.removed)){setStatus('🎉 Board cleared — you win!');return;}
    if(!hasMove())setStatus('No moves left! Shuffle to continue.');
    else setStatus('Nice match!');
    return;}
  sel=t;render();
}
function freeTiles(){return tiles.filter(t=>!t.removed&&isFree(t));}
function hasMove(){const f=freeTiles();for(let i=0;i<f.length;i++)for(let j=i+1;j<f.length;j++)if(f[i].sym===f[j].sym)return true;return false;}
document.getElementById('hint').onclick=()=>{
  const f=freeTiles();for(let i=0;i<f.length;i++)for(let j=i+1;j<f.length;j++)if(f[i].sym===f[j].sym){
    sel=f[i];render();const els=wrap.querySelectorAll('.tile');
    // flash both
    setStatus('Try matching '+f[i].sym);return;}
  setStatus('No matches among free tiles — shuffle!');
};
document.getElementById('shuffle').onclick=()=>{
  const live=tiles.filter(t=>!t.removed);let syms=live.map(t=>t.sym);
  for(let i=syms.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[syms[i],syms[j]]=[syms[j],syms[i]];}
  live.forEach((t,i)=>t.sym=syms[i]);sel=null;render();setStatus('Shuffled the remaining tiles.');
};
document.getElementById('newg').onclick=newBoard;
newBoard();
</script>
</body>
</html>
