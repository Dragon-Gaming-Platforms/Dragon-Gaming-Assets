<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>MathDoku</title>
<style>
  *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0f1720;color:#eef;
    font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px;user-select:none;-webkit-user-select:none}
  h1{margin:2px 0;font-size:clamp(18px,5vw,24px)}
  #status{min-height:18px;font-weight:700;color:#ffe08a;text-align:center;max-width:420px}
  #grid{display:grid;grid-template-columns:repeat(4,66px);grid-template-rows:repeat(4,66px);background:#000;gap:0;border:3px solid #000;border-radius:4px}
  .cell{position:relative;background:#182430;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;cursor:pointer;color:#fff}
  .cell.sel{background:#2b4a63}
  .cell.bad{color:#ff6b6b}
  .cage{position:absolute;top:2px;left:4px;font-size:12px;font-weight:700;color:#ffd76a}
  .bt{border-top:3px solid #000}.bl{border-left:3px solid #000}.bb{border-bottom:3px solid #000}.br{border-right:3px solid #000}
  #pad{display:grid;grid-template-columns:repeat(5,52px);gap:6px}
  #pad button{height:48px;font-size:20px;font-weight:800;background:#26303a;color:#eef;border:0;border-radius:8px;cursor:pointer}
  .top button{background:#ffcc33;color:#20150a;border:0;border-radius:9px;padding:8px 14px;font-weight:800;cursor:pointer}
  .hint{font-size:12px;opacity:.75;text-align:center;max-width:430px}
</style>
</head>
<body>
<h1>MathDoku</h1>
<div id="status">Each cage must reach its target using the shown operation.</div>
<div id="grid"></div>
<div id="pad"></div>
<div class="top"><button id="check">Check</button> <button id="newg">New Puzzle</button></div>
<div class="hint">Fill 1–4 so each row and column has no repeats, and every outlined cage's numbers combine (via its + − × ÷ target) to the shown value.</div>
<script>
const N=4;
let sol,cages,cellCage,grid,sel=null;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function genLatin(){
  const g=Array.from({length:N},()=>Array(N).fill(0));
  function ok(r,c,v){for(let k=0;k<N;k++){if(g[r][k]===v||g[k][c]===v)return false;}return true;}
  function bt(pos){if(pos===N*N)return true;const r=Math.floor(pos/N),c=pos%N;
    for(const v of shuffle([1,2,3,4])){if(ok(r,c,v)){g[r][c]=v;if(bt(pos+1))return true;g[r][c]=0;}}return false;}
  bt(0);return g;
}
function makeCages(){
  // random contiguous partition into cages of size 1-3
  const id=Array.from({length:N},()=>Array(N).fill(-1));
  let cid=0;const cellsList=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)cellsList.push([r,c]);
  for(const [r,c] of cellsList){
    if(id[r][c]!==-1)continue;
    const size=1+Math.floor(Math.random()*3);
    const members=[[r,c]];id[r][c]=cid;
    while(members.length<size){
      // find a neighbour of any member that's free
      const opts=[];
      for(const [mr,mc] of members){
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{const nr=mr+dr,nc=mc+dc;
          if(nr>=0&&nr<N&&nc>=0&&nc<N&&id[nr][nc]===-1)opts.push([nr,nc]);});
      }
      if(!opts.length)break;
      const [nr,nc]=opts[Math.floor(Math.random()*opts.length)];
      if(id[nr][nc]===-1){id[nr][nc]=cid;members.push([nr,nc]);}
    }
    cid++;
  }
  cellCage=id;
  cages=[];
  for(let k=0;k<cid;k++){
    const members=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(id[r][c]===k)members.push([r,c]);
    const vals=members.map(([r,c])=>sol[r][c]);
    let op,target;
    if(members.length===1){op='';target=vals[0];}
    else{
      const choices=[];
      choices.push(['+',vals.reduce((a,b)=>a+b,0)]);
      choices.push(['×',vals.reduce((a,b)=>a*b,1)]);
      if(members.length===2){
        choices.push(['−',Math.abs(vals[0]-vals[1])]);
        const mx=Math.max(...vals),mn=Math.min(...vals);
        if(mx%mn===0)choices.push(['÷',mx/mn]);
      }
      [op,target]=choices[Math.floor(Math.random()*choices.length)];
    }
    cages.push({members,op,target,anchor:members[0]});
  }
}
function gen(){
  sol=genLatin();makeCages();
  grid=Array.from({length:N},()=>Array(N).fill(0));sel=null;
  document.getElementById('status').textContent='Fill in every cell.';
  render();
}
function anchorText(cage){return cage.op?cage.target+cage.op:''+cage.target;}
function badCell(r,c){if(!grid[r][c])return false;
  for(let k=0;k<N;k++){if(k!==c&&grid[r][k]===grid[r][c])return true;if(k!==r&&grid[k][c]===grid[r][c])return true;}
  return false;
}
function render(){
  const g=document.getElementById('grid');g.innerHTML='';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const cell=document.createElement('div');cell.className='cell';
    const cg=cellCage[r][c];
    if(r===0||cellCage[r-1][c]!==cg)cell.classList.add('bt');
    if(c===0||cellCage[r][c-1]!==cg)cell.classList.add('bl');
    if(r===N-1||cellCage[r+1][c]!==cg)cell.classList.add('bb');
    if(c===N-1||cellCage[r][c+1]!==cg)cell.classList.add('br');
    if(sel&&sel.r===r&&sel.c===c)cell.classList.add('sel');
    if(badCell(r,c))cell.classList.add('bad');
    const cage=cages.find(x=>x.anchor[0]===r&&x.anchor[1]===c);
    if(cage){const s=document.createElement('span');s.className='cage';s.textContent=anchorText(cage);cell.appendChild(s);}
    cell.appendChild(document.createTextNode(grid[r][c]||''));
    cell.onclick=()=>{sel={r,c};render();};
    g.appendChild(cell);
  }
}
function place(v){if(!sel)return;grid[sel.r][sel.c]=v;render();}
function cageOk(cage){
  const vals=cage.members.map(([r,c])=>grid[r][c]);
  if(vals.some(v=>!v))return false;
  if(cage.op==='')return vals[0]===cage.target;
  if(cage.op==='+')return vals.reduce((a,b)=>a+b,0)===cage.target;
  if(cage.op==='×')return vals.reduce((a,b)=>a*b,1)===cage.target;
  if(cage.op==='−')return Math.abs(vals[0]-vals[1])===cage.target;
  if(cage.op==='÷'){const mx=Math.max(...vals),mn=Math.min(...vals);return mn>0&&mx%mn===0&&mx/mn===cage.target;}
  return false;
}
document.getElementById('check').onclick=()=>{
  let full=true;for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!grid[r][c])full=false;
  if(!full){document.getElementById('status').textContent='Grid not full yet.';return;}
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(badCell(r,c)){document.getElementById('status').textContent='A row or column has a repeat.';return;}
  if(cages.every(cageOk))document.getElementById('status').textContent='🎉 Solved! Every cage checks out.';
  else document.getElementById('status').textContent='Some cages do not match their targets.';
};
document.getElementById('newg').onclick=gen;
const pad=document.getElementById('pad');
[1,2,3,4].forEach(v=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>place(v);pad.appendChild(b);});
const clr=document.createElement('button');clr.textContent='✕';clr.onclick=()=>place(0);pad.appendChild(clr);
gen();
</script>
</body>
</html>
