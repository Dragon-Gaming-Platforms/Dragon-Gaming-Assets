<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Tank Duel</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:#0b1220;color:#eef;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:8px;padding:10px;user-select:none;-webkit-user-select:none}
  h1{margin:0;font-size:clamp(18px,5vw,26px)}
  #hud{display:flex;gap:24px;font-weight:800}
  .p1{color:#5ce08a}.p2{color:#e08a8a}
  canvas{background:linear-gradient(#1a2a44,#0b1220);border-radius:10px;touch-action:none;max-width:96vw;height:auto}
  #status{min-height:18px;color:#9ad;font-weight:700;text-align:center}
  #controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
  .ctl{background:rgba(255,255,255,.08);border-radius:10px;padding:6px 10px;display:flex;gap:6px;align-items:center;font-weight:700}
  button{background:#4aa3ff;color:#04152a;border:0;border-radius:8px;padding:8px 12px;font-weight:800;cursor:pointer}
  #fire{background:#ff7043;color:#2a0e00;padding:10px 22px}
  button:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>
<h1>Tank Duel</h1>
<div id="hud"><span class="p1">You: <b id="hp1">100</b></span><span>Wind: <b id="wind">0</b></span><span class="p2">CPU: <b id="hp2">100</b></span></div>
<canvas id="c" width="480" height="320"></canvas>
<div id="status">Set angle & power, then Fire!</div>
<div id="controls">
  <div class="ctl">Angle <button id="aM">−</button><b id="ang">45</b>°<button id="aP">+</button></div>
  <div class="ctl">Power <button id="pM">−</button><b id="pow">50</b><button id="pP">+</button></div>
  <button id="fire">🔥 Fire</button>
</div>
<button id="reset" style="display:none">New Game</button>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');const W=cv.width,H=cv.height;
let terrain,tank1,tank2,angle,power,wind,turn,hp1,hp2,shell,over;
function genTerrain(){terrain=[];let h=H*0.6;for(let x=0;x<=W;x++){h+=(Math.random()-0.5)*6;h=Math.max(H*0.4,Math.min(H*0.85,h));terrain[x]=h;}
  // smooth
  for(let k=0;k<3;k++)for(let x=1;x<W;x++)terrain[x]=(terrain[x-1]+terrain[x]+terrain[x+1])/3;}
function groundAt(x){x=Math.max(0,Math.min(W,Math.round(x)));return terrain[x];}
function init(){
  genTerrain();
  tank1={x:60};tank2={x:W-60};tank1.y=groundAt(tank1.x);tank2.y=groundAt(tank2.x);
  angle=45;power=50;wind=Math.round((Math.random()-0.5)*20);turn=1;hp1=100;hp2=100;shell=null;over=false;
  document.getElementById('reset').style.display='none';
  updateHud();draw();setControls(true);
  document.getElementById('status').textContent='Your turn — set angle & power, then Fire!';
}
function updateHud(){document.getElementById('hp1').textContent=Math.max(0,hp1);document.getElementById('hp2').textContent=Math.max(0,hp2);
  document.getElementById('wind').textContent=(wind>0?'→':wind<0?'←':'')+Math.abs(wind);
  document.getElementById('ang').textContent=angle;document.getElementById('pow').textContent=power;}
function setControls(on){['aM','aP','pM','pP','fire'].forEach(id=>document.getElementById(id).disabled=!on||over);}
function fire(from,ang,pw){
  const dir=from===1?1:-1;const rad=ang*Math.PI/180;
  const t=from===1?tank1:tank2;
  shell={x:t.x,y:t.y-16,vx:Math.cos(rad)*pw*0.18*dir,vy:-Math.sin(rad)*pw*0.18,from};
  setControls(false);step();
}
function step(){
  if(!shell){return;}
  shell.x+=shell.vx;shell.y+=shell.vy;shell.vy+=0.12;shell.vx+=wind*0.0016;
  let hit=false,msg='';
  if(shell.x<0||shell.x>W){hit=true;msg='Off the map.';}
  else if(shell.y>=groundAt(shell.x)){
    // check tank proximity
    const target=shell.from===1?tank2:tank1;
    const d=Math.hypot(shell.x-target.x,shell.y-target.y);
    const dmg=Math.max(0,Math.round(40-d));
    craterAt(shell.x);
    if(d<40){if(shell.from===1){hp2-=dmg;}else{hp1-=dmg;}msg=`Direct-ish hit! ${dmg} damage.`;}
    else msg='Missed the tank.';
    hit=true;
  }
  draw();drawShell();
  if(hit){shell=null;updateHud();
    if(hp1<=0||hp2<=0){over=true;document.getElementById('status').textContent=hp2<=0?'🎉 You destroyed the enemy tank!':'💥 Your tank was destroyed. CPU wins.';
      document.getElementById('reset').style.display='';setControls(false);return;}
    document.getElementById('status').textContent=msg;
    // next turn
    setTimeout(()=>{ if(turn===1){turn=2;cpuTurn();} else {turn=1;wind=Math.round((Math.random()-0.5)*20);updateHud();setControls(true);document.getElementById('status').textContent='Your turn — set angle & power, then Fire!';} },900);
    return;
  }
  requestAnimationFrame(step);
}
function craterAt(x){for(let i=-14;i<=14;i++){const xi=Math.round(x+i);if(xi>=0&&xi<=W){terrain[xi]+=(14-Math.abs(i))*0.6;terrain[xi]=Math.min(terrain[xi],H);}}
  tank1.y=groundAt(tank1.x);tank2.y=groundAt(tank2.x);}
function cpuTurn(){
  document.getElementById('status').textContent='CPU is aiming…';
  // rough physics-based aim with noise
  const dx=tank1.x-tank2.x;
  let bestA=45,bestP=50,bestErr=1e9;
  for(let a=25;a<=75;a+=5)for(let p=30;p<=90;p+=5){
    const err=simulate(2,a,p);if(err<bestErr){bestErr=err;bestA=a;bestP=p;}
  }
  const ang=bestA+(Math.random()*10-5),pw=bestP+(Math.random()*10-5);
  setTimeout(()=>fire(2,ang,pw),700);
}
function simulate(from,ang,pw){
  const dir=from===1?1:-1;const rad=ang*Math.PI/180;const t=from===1?tank1:tank2;
  let x=t.x,y=t.y-16,vx=Math.cos(rad)*pw*0.18*dir,vy=-Math.sin(rad)*pw*0.18;
  for(let i=0;i<600;i++){x+=vx;y+=vy;vy+=0.12;vx+=wind*0.0016;
    if(x<0||x>W)return 1e9;if(y>=groundAt(x)){const target=from===1?tank2:tank1;return Math.hypot(x-target.x,y-target.y);}}
  return 1e9;
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#6b8e3a';ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W;x++)ctx.lineTo(x,terrain[x]);ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  drawTank(tank1,'#5ce08a',1);drawTank(tank2,'#e08a8a',-1);
}
function drawTank(t,color,dir){
  ctx.fillStyle=color;ctx.fillRect(t.x-14,t.y-10,28,10);
  ctx.beginPath();ctx.arc(t.x,t.y-10,8,Math.PI,0);ctx.fill();
  // barrel shows own angle when it's this tank's turn set
  const a=t===tank1?angle:45;
  ctx.strokeStyle=color;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(t.x,t.y-13);
  ctx.lineTo(t.x+Math.cos(a*Math.PI/180)*20*dir,t.y-13-Math.sin(a*Math.PI/180)*20);ctx.stroke();
}
function drawShell(){if(shell){ctx.fillStyle='#ffd76a';ctx.beginPath();ctx.arc(shell.x,shell.y,4,0,7);ctx.fill();}}
document.getElementById('aM').onclick=()=>{angle=Math.max(5,angle-5);updateHud();draw();};
document.getElementById('aP').onclick=()=>{angle=Math.min(85,angle+5);updateHud();draw();};
document.getElementById('pM').onclick=()=>{power=Math.max(10,power-5);updateHud();};
document.getElementById('pP').onclick=()=>{power=Math.min(100,power+5);updateHud();};
document.getElementById('fire').onclick=()=>{if(turn===1&&!over&&!shell)fire(1,angle,power);};
document.getElementById('reset').onclick=init;
init();
</script>
</body>
</html>
