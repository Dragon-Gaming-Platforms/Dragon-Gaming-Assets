<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Paddle Battle</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:#05070d;color:#dff;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:8px;padding:10px;user-select:none;-webkit-user-select:none}
  h1{margin:0;font-size:clamp(18px,5vw,26px)}
  canvas{background:#0a0f18;border-radius:10px;border:2px solid #1a2740;touch-action:none;max-width:96vw;height:auto}
  #status{min-height:18px;color:#7fd;font-weight:700;text-align:center}
  .row{display:flex;gap:10px;align-items:center}
  button,select{background:#39c;color:#02121a;border:0;border-radius:10px;padding:9px 16px;font-weight:800;cursor:pointer}
  select{background:rgba(255,255,255,.1);color:#eee}
  .hint{font-size:12px;opacity:.7}
</style>
</head>
<body>
<h1>Paddle Battle</h1>
<div id="status">First to 7 wins. Move your paddle with the mouse, touch, or ↑ / ↓.</div>
<canvas id="c" width="640" height="400"></canvas>
<div class="row">
  <button id="startBtn">Serve</button>
  <select id="level"><option value="easy">Easy</option><option value="normal" selected>Normal</option><option value="hard">Hard</option></select>
</div>
<div class="hint">Mouse / touch to move · ↑ ↓ keys · click Serve to launch</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');const W=cv.width,H=cv.height;
const PW=12,PH=76;
let pl,ai,ball,scoreP,scoreA,running,serve,keys={},over;
function reset(){pl={y:H/2-PH/2};ai={y:H/2-PH/2};scoreP=0;scoreA=0;over=false;serveBall(1);running=false;draw();}
function serveBall(dir){ball={x:W/2,y:H/2,vx:dir*4.5,vy:(Math.random()*2-1)*3,r:8};serve=true;}
function launch(){if(over){reset();document.getElementById('startBtn').textContent='Serve';return;}serve=false;running=true;}
document.getElementById('startBtn').onclick=()=>{launch();};
cv.addEventListener('mousemove',e=>movePad(e));
cv.addEventListener('touchmove',e=>{movePad(e);e.preventDefault();},{passive:false});
function movePad(e){const rect=cv.getBoundingClientRect();const sy=cv.height/rect.height;const t=e.touches?e.touches[0]:e;
  pl.y=(t.clientY-rect.top)*sy-PH/2;clampP();}
document.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();
  if(e.key===' '){launch();e.preventDefault();}});
document.addEventListener('keyup',e=>{keys[e.key]=false;});
function clampP(){pl.y=Math.max(0,Math.min(H-PH,pl.y));}
function aiSpeed(){return {easy:3.3,normal:4.6,hard:6.2}[document.getElementById('level').value];}
function loop(){
  requestAnimationFrame(loop);
  if(keys['ArrowUp'])pl.y-=6;if(keys['ArrowDown'])pl.y+=6;clampP();
  if(running&&!serve){
    ball.x+=ball.vx;ball.y+=ball.vy;
    if(ball.y-ball.r<0){ball.y=ball.r;ball.vy*=-1;}
    if(ball.y+ball.r>H){ball.y=H-ball.r;ball.vy*=-1;}
    // player paddle
    if(ball.x-ball.r<20+PW&&ball.x-ball.r>10&&ball.y>pl.y&&ball.y<pl.y+PH&&ball.vx<0){
      ball.vx*=-1.06;ball.vy+=((ball.y-(pl.y+PH/2))/(PH/2))*3;ball.x=20+PW+ball.r;}
    // ai paddle
    if(ball.x+ball.r>W-20-PW&&ball.x+ball.r<W-10&&ball.y>ai.y&&ball.y<ai.y+PH&&ball.vx>0){
      ball.vx*=-1.06;ball.vy+=((ball.y-(ai.y+PH/2))/(PH/2))*3;ball.x=W-20-PW-ball.r;}
    // ai movement
    const target=ball.vx>0?ball.y-PH/2:H/2-PH/2;const sp=aiSpeed();
    if(ai.y+PH/2<ball.y-6)ai.y+=Math.min(sp,ball.y-(ai.y+PH/2));
    else if(ai.y+PH/2>ball.y+6)ai.y-=Math.min(sp,(ai.y+PH/2)-ball.y);
    ai.y=Math.max(0,Math.min(H-PH,ai.y));
    // cap speed
    ball.vx=Math.max(-11,Math.min(11,ball.vx));ball.vy=Math.max(-9,Math.min(9,ball.vy));
    // scoring
    if(ball.x<-10){scoreA++;point('ai');}
    else if(ball.x>W+10){scoreP++;point('pl');}
  }
  draw();
}
function point(who){
  if(scoreP>=7||scoreA>=7){over=true;running=false;
    document.getElementById('status').textContent=scoreP>=7?'🎉 You win the match!':'CPU wins the match. Try again!';
    document.getElementById('startBtn').textContent='Play Again';serve=true;return;}
  serveBall(who==='pl'?-1:1);running=true;
  document.getElementById('status').textContent='Serving…';
  setTimeout(()=>{if(!over)document.getElementById('status').textContent='';},600);
}
function draw(){
  ctx.fillStyle='#0a0f18';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.2)';ctx.setLineDash([8,12]);ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#fff';ctx.font='bold 40px system-ui';ctx.textAlign='center';
  ctx.fillText(scoreP,W/2-60,50);ctx.fillText(scoreA,W/2+60,50);
  ctx.fillStyle='#5ce0ff';ctx.fillRect(20,pl.y,PW,PH);
  ctx.fillStyle='#ff8a8a';ctx.fillRect(W-20-PW,ai.y,PW,PH);
  ctx.fillStyle='#ffd76a';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fill();
  if(serve&&!over){ctx.fillStyle='rgba(255,255,255,.8)';ctx.font='bold 18px system-ui';ctx.fillText('Press Serve / Space',W/2,H-30);}
}
reset();loop();
</script>
</body>
</html>
