<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Color Lines</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:radial-gradient(circle at 50% 0,#1a2434,#080c12 60%);color:#eef;
    font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;display:flex;flex-direction:column;
    align-items:center;justify-content:center;min-height:100vh;gap:10px;padding:14px;user-select:none;-webkit-user-select:none}
  h1{margin:0;font-size:clamp(20px,5vw,28px)}
  #hud{display:flex;gap:20px;font-weight:700;color:#9fd}
  #board{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;width:min(94vw,430px);aspect-ratio:1/1;
    background:#2a3648;padding:6px;border-radius:12px}
  .cell{background:#1b2434;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .cell.path{background:#31445e}
  .ball{width:78%;height:78%;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.5),inset 0 3px 6px rgba(255,255,255,.35)}
  .ball.small{width:34%;height:34%}
  .ball.sel{animation:bob .5s infinite alternate}
  @keyframes bob{to{transform:translateY(-18%)}}
  #status{min-height:20px;color:#8fd0ff;font-weight:700}
  button{background:#4aa3ff;color:#04152a;border:0;border-radius:10px;padding:9px 16px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<h1>Color Lines</h1>
<div id="hud"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div>
<div id="status">Move a ball to an empty cell. Line up 5+ of a colour to clear them.</div>
<div id="board"></div>
<button id="newG">New Game</button>
<script>
const N=9,COLORS=['#e6394a','#f5a623','#f8e71c','#2ecc71','#3aa0ff','#b06bff','#ff7ac0'];
let g,next,sel,score,best=+localStorage.getItem('cl_best')||0,over;
document.getElementById('best').textContent=best;
const boardEl=document.getElementById('board');
function init(){
  g=Array.from({length:N},()=>Array(N).fill(-1));
  sel=null;score=0;over=false;
  next=spawn(3);placeNext();next=pick(3);
  document.getElementById('score').textContent=0;
  document.getElementById('status').textContent='Select a ball, then an empty cell.';
  render();
}
function pick(k){return Array.from({length:k},()=>Math.floor(Math.random()*COLORS.length));}
function spawn(k){return pick(k);}
function emptyCells(){const e=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(g[r][c]<0)e.push([r,c]);return e;}
function placeNext(){
  const e=emptyCells();
  for(const col of next){if(!e.length)break;const idx=Math.floor(Math.random()*e.length);const[r,c]=e.splice(idx,1)[0];g[r][c]=col;checkLines(r,c);}
  if(!emptyCells().length){over=true;}
}
function path(a,b){ // BFS reachability a->b over empty cells
  const[sr,sc]=a,[tr,tc]=b;if(g[tr][tc]>=0)return false;
  const seen=Array.from({length:N},()=>Array(N).fill(false));
  const q=[[sr,sc]];seen[sr][sc]=true;
  while(q.length){const[r,c]=q.shift();if(r===tr&&c===tc)return true;
    for(const[dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<N&&nc>=0&&nc<N&&!seen[nr][nc]&&g[nr][nc]<0){seen[nr][nc]=true;q.push([nr,nc]);}}}
  return false;
}
function checkLines(r,c){
  const col=g[r][c];if(col<0)return 0;
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];const toClear=new Set();
  for(const[dr,dc] of dirs){
    const line=[[r,c]];
    for(let s=1;;s++){const nr=r+dr*s,nc=c+dc*s;if(nr<0||nr>=N||nc<0||nc>=N||g[nr][nc]!==col)break;line.push([nr,nc]);}
    for(let s=1;;s++){const nr=r-dr*s,nc=c-dc*s;if(nr<0||nr>=N||nc<0||nc>=N||g[nr][nc]!==col)break;line.push([nr,nc]);}
    if(line.length>=5)line.forEach(([lr,lc])=>toClear.add(lr+','+lc));
  }
  if(toClear.size){toClear.forEach(k=>{const[lr,lc]=k.split(',').map(Number);g[lr][lc]=-1;});
    score+=toClear.size*2;return toClear.size;}
  return 0;
}
function render(){
  boardEl.innerHTML='';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const cell=document.createElement('div');cell.className='cell';
    if(g[r][c]>=0){const b=document.createElement('div');b.className='ball'+(sel&&sel[0]===r&&sel[1]===c?' sel':'');
      b.style.background=COLORS[g[r][c]];cell.appendChild(b);}
    cell.onclick=()=>click(r,c);boardEl.appendChild(cell);
  }
  document.getElementById('score').textContent=score;
  if(over){document.getElementById('status').textContent=`Board full! Final score ${score}. New Game to retry.`;
    if(score>best){best=score;localStorage.setItem('cl_best',best);document.getElementById('best').textContent=best;}}
}
function click(r,c){
  if(over)return;
  if(g[r][c]>=0){sel=[r,c];render();return;}
  if(sel){
    if(path(sel,[r,c])){
      g[r][c]=g[sel[0]][sel[1]];g[sel[0]][sel[1]]=-1;const cleared=checkLines(r,c);sel=null;
      if(!cleared){placeNext();next=pick(3);}
      render();
    } else {document.getElementById('status').textContent='No clear path to that cell.';}
  }
}
document.getElementById('newG').onclick=init;
init();
</script>
</body>
</html>
