<!DOCTYPE html>
<head>
<title>Play Obsidian</title>
</head>
<body>
<div style="position:relative;width:100%;aspect-ratio:100/100;">
  <iframe
    src="https://playobsidian.com"
    width="100%"
    height="100%"
    style="border:0;overflow:hidden;"
    scrolling="auto"
    frameborder="0"
    name="Play Obsidian"
    referrerpolicy="no-referrer"
    sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-top-navigation"
    allow="autoplay; microphone; camera"
  ></iframe>
</div>
</body>
</html>
