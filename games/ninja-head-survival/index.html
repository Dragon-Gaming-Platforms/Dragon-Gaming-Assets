<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Ninja Head Survival</title>
  <meta name="theme-color" content="#151814">
  <meta name="description" content="Survive the zombie horde in this quick ninja arena game.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #151814;
      color: #f4f0dc;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
    }

    .game-shell {
      position: relative;
      width: min(100vw, 150vh, 1200px);
      aspect-ratio: 3 / 2;
      max-height: 100vh;
      max-height: 100dvh;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      border: 3px solid #322f25;
      background: #211f1a;
      image-rendering: pixelated;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      touch-action: none;
    }

    .touch-controls {
      display: none;
      position: absolute;
      inset: auto 0 14px;
      align-items: end;
      justify-content: space-between;
      padding: 0 20px;
      pointer-events: none;
      touch-action: none;
    }

    .joystick, .attack-button {
      pointer-events: auto;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    .joystick {
      width: clamp(100px, 20vw, 150px);
      height: clamp(100px, 20vw, 150px);
      border: 2px solid rgba(244, 240, 220, 0.55);
      border-radius: 50%;
      background: rgba(8, 8, 8, 0.42);
      position: relative;
    }

    .joystick::after {
      content: "MOVE";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(244, 240, 220, 0.6);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      pointer-events: none;
    }

    .joystick-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 42%;
      height: 42%;
      border-radius: 50%;
      background: rgba(215, 53, 53, 0.82);
      border: 2px solid rgba(244, 240, 220, 0.8);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .attack-button {
      width: clamp(82px, 16vw, 118px);
      height: clamp(82px, 16vw, 118px);
      border: 3px solid #f4f0dc;
      border-radius: 50%;
      background: rgba(199, 31, 47, 0.78);
      color: #fff8e6;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    }

    .attack-button:active { background: rgba(255, 90, 65, 0.92); }

    @media (pointer: coarse) {
      .touch-controls { display: flex; }
    }

    @media (orientation: portrait) and (pointer: coarse) {
      .touch-controls { bottom: 10px; padding: 0 14px; }
      .joystick { width: clamp(86px, 24vw, 125px); height: clamp(86px, 24vw, 125px); }
      .attack-button { width: clamp(72px, 20vw, 100px); height: clamp(72px, 20vw, 100px); }
    }
  </style>
</head>
<body>
  <main class="game-shell" aria-label="Ninja Head Survival game">
    <canvas id="gameCanvas" width="1200" height="800" aria-label="Game arena. Tap to start, aim and throw stars; use the on-screen controls to move and attack."></canvas>
    <div class="touch-controls" aria-label="Touch controls">
      <div class="joystick" id="joystick" role="application" aria-label="Movement joystick">
        <div class="joystick-knob" id="joystickKnob"></div>
      </div>
      <button class="attack-button" id="attackButton" type="button" aria-label="Throw a star at the nearest zombie">ATTACK</button>
    </div>
  </main>

  <script>
    // Update this single value for each release, following MAJOR.MINOR.PATCH.
    const APP_VERSION = "1.0.1";
    const HIGH_SCORE_KEY = "ninja-head-survival-high-score";
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const gameShell = document.querySelector(".game-shell");
    const joystick = document.getElementById("joystick");
    const joystickKnob = document.getElementById("joystickKnob");
    const attackButton = document.getElementById("attackButton");

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    const keys = {};

    let state = "start";
    let player;
    let zombies = [];
    let stars = [];
    let lastTime = 0;
    let spawnTimer = 0;
    let survivalTime = 0;
    let killCount = 0;
    let highScore = loadHighScore();
    const touchMove = { x: 0, y: 0 };

    function loadHighScore() {
      try {
        const saved = Number.parseInt(localStorage.getItem(HIGH_SCORE_KEY), 10);
        return Number.isFinite(saved) && saved >= 0 ? saved : 0;
      } catch (error) {
        return 0;
      }
    }

    function saveHighScore() {
      if (killCount <= highScore) return;
      highScore = killCount;
      try {
        localStorage.setItem(HIGH_SCORE_KEY, String(highScore));
      } catch (error) {
        // The game remains playable when browser storage is disabled or full.
      }
    }

    class Player {
      constructor() {
        this.x = WIDTH / 2;
        this.y = HEIGHT / 2;
        this.radius = 28;
        this.speed = 260;
        this.maxHealth = 100;
        this.health = this.maxHealth;
      }

      update(dt) {
        let dx = 0;
        let dy = 0;

        if (keys.a || keys.arrowleft) dx -= 1;
        if (keys.d || keys.arrowright) dx += 1;
        if (keys.w || keys.arrowup) dy -= 1;
        if (keys.s || keys.arrowdown) dy += 1;

        dx += touchMove.x;
        dy += touchMove.y;

        if (dx !== 0 || dy !== 0) {
          const length = Math.hypot(dx, dy);
          dx /= length;
          dy /= length;
        }

        this.x += dx * this.speed * dt;
        this.y += dy * this.speed * dt;

        this.x = clamp(this.x, this.radius, WIDTH - this.radius);
        this.y = clamp(this.y, this.radius, HEIGHT - this.radius);
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
        ctx.beginPath();
        ctx.ellipse(0, 26, 25, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#070707";
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#c91f2f";
        ctx.beginPath();
        ctx.ellipse(0, -10, 27, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#0c0c0c";
        ctx.fillRect(-27, -9, 54, 16);

        ctx.fillStyle = "#c59a72";
        ctx.beginPath();
        ctx.ellipse(0, 4, 18, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#f3ead3";
        ctx.beginPath();
        ctx.arc(-8, 2, 3, 0, Math.PI * 2);
        ctx.arc(8, 2, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#17100d";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-13, -2);
        ctx.lineTo(-4, 0);
        ctx.moveTo(13, -2);
        ctx.lineTo(4, 0);
        ctx.stroke();

        ctx.restore();
      }
    }

    class Zombie {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 25;
        this.speed = 54 + Math.random() * 22;
        this.maxHealth = 90;
        this.health = this.maxHealth;
      }

      update(dt, target) {
        const dx = target.x - this.x;
        const dy = target.y - this.y;
        const distance = Math.hypot(dx, dy) || 1;

        this.x += (dx / distance) * this.speed * dt;
        this.y += (dy / distance) * this.speed * dt;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
        ctx.beginPath();
        ctx.ellipse(0, 24, 23, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#4ea43f";
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#397e30";
        ctx.beginPath();
        ctx.arc(-11, -12, 7, 0, Math.PI * 2);
        ctx.arc(12, 10, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#efe9be";
        ctx.beginPath();
        ctx.arc(-9, -3, 5, 0, Math.PI * 2);
        ctx.arc(9, -3, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#111";
        ctx.beginPath();
        ctx.arc(-8, -2, 2, 0, Math.PI * 2);
        ctx.arc(10, -4, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#173715";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-12, 11);
        ctx.lineTo(-5, 15);
        ctx.lineTo(2, 11);
        ctx.lineTo(9, 15);
        ctx.stroke();

        ctx.strokeStyle = "#2e6b28";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-19, 4);
        ctx.lineTo(-9, 9);
        ctx.moveTo(14, -17);
        ctx.lineTo(20, -7);
        ctx.stroke();

        ctx.fillStyle = "#2b1d19";
        ctx.fillRect(-24, -36, 48, 6);
        ctx.fillStyle = "#d63d36";
        ctx.fillRect(-24, -36, 48 * Math.max(this.health, 0) / this.maxHealth, 6);

        ctx.restore();
      }
    }

    class ThrowingStar {
      constructor(x, y, targetX, targetY) {
        this.x = x;
        this.y = y;
        this.radius = 12;
        this.speed = 650;
        this.damage = 46;
        this.rotation = 0;
        this.alive = true;

        const dx = targetX - x;
        const dy = targetY - y;
        const distance = Math.hypot(dx, dy) || 1;
        this.vx = (dx / distance) * this.speed;
        this.vy = (dy / distance) * this.speed;
      }

      update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.rotation += 14 * dt;

        if (
          this.x < -this.radius ||
          this.x > WIDTH + this.radius ||
          this.y < -this.radius ||
          this.y > HEIGHT + this.radius
        ) {
          this.alive = false;
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        ctx.fillStyle = "#d8d8d2";
        ctx.strokeStyle = "#6f706b";
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const angle = i * Math.PI / 4;
          const radius = i % 2 === 0 ? 15 : 5;
          ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#211f1a";
        ctx.beginPath();
        ctx.arc(0, 0, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function startGame() {
      player = new Player();
      zombies = [];
      stars = [];
      spawnTimer = 0;
      survivalTime = 0;
      killCount = 0;
      state = "playing";

      for (let i = 0; i < 5; i++) {
        spawnZombie();
      }
    }

    function spawnZombie() {
      const side = Math.floor(Math.random() * 4);
      let x;
      let y;

      if (side === 0) {
        x = Math.random() * WIDTH;
        y = -30;
      } else if (side === 1) {
        x = WIDTH + 30;
        y = Math.random() * HEIGHT;
      } else if (side === 2) {
        x = Math.random() * WIDTH;
        y = HEIGHT + 30;
      } else {
        x = -30;
        y = Math.random() * HEIGHT;
      }

      zombies.push(new Zombie(x, y));
    }

    function getMousePosition(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * (WIDTH / rect.width),
        y: (event.clientY - rect.top) * (HEIGHT / rect.height)
      };
    }

    function update(dt) {
      if (state !== "playing") return;

      survivalTime += dt;
      spawnTimer += dt;

      const spawnDelay = Math.max(0.55, 1.8 - survivalTime * 0.015);
      while (spawnTimer >= spawnDelay) {
        spawnTimer -= spawnDelay;
        spawnZombie();
      }

      player.update(dt);

      for (const star of stars) {
        star.update(dt);
      }

      for (const zombie of zombies) {
        zombie.update(dt, player);

        const touchingPlayer = Math.hypot(zombie.x - player.x, zombie.y - player.y) < zombie.radius + player.radius;
        if (touchingPlayer) {
          player.health -= 32 * dt;
        }
      }

      for (const star of stars) {
        if (!star.alive) continue;

        for (const zombie of zombies) {
          if (zombie.health < 0) continue;

          const hit = Math.hypot(star.x - zombie.x, star.y - zombie.y) < star.radius + zombie.radius;
          if (hit) {
            zombie.health -= star.damage;
            star.alive = false;

            if (zombie.health < 0) {
              killCount += 1;
            }

            break;
          }
        }
      }

      stars = stars.filter(star => star.alive);
      zombies = zombies.filter(zombie => zombie.health >= 0);

      if (player.health < 0) {
        player.health = 0;
        saveHighScore();
        state = "gameover";
      }
    }

    function drawBackground() {
      ctx.fillStyle = "#211f1a";
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      const tileSize = 50;
      for (let y = 0; y < HEIGHT; y += tileSize) {
        for (let x = 0; x < WIDTH; x += tileSize) {
          const shade = ((x * 31 + y * 17) % 5) * 4;
          ctx.fillStyle = `rgb(${32 + shade}, ${31 + shade}, ${26 + shade})`;
          ctx.fillRect(x, y, tileSize, tileSize);
        }
      }

      ctx.strokeStyle = "rgba(12, 13, 11, 0.45)";
      ctx.lineWidth = 1;
      for (let x = 0; x <= WIDTH; x += tileSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, HEIGHT);
        ctx.stroke();
      }

      for (let y = 0; y <= HEIGHT; y += tileSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(WIDTH, y);
        ctx.stroke();
      }

      ctx.fillStyle = "rgba(96, 70, 42, 0.2)";
      for (let i = 0; i < 24; i++) {
        const x = (i * 173) % WIDTH;
        const y = (i * 97) % HEIGHT;
        ctx.fillRect(x, y, 8 + (i % 4) * 5, 4);
      }
    }

    function drawHud() {
      const healthWidth = 260;
      const healthPercent = player.health / player.maxHealth;

      ctx.fillStyle = "rgba(8, 8, 8, 0.55)";
      ctx.fillRect(22, 20, 340, 92);

      ctx.fillStyle = "#f4f0dc";
      ctx.font = "22px Arial";
      ctx.fillText("Ninja Health", 38, 48);

      ctx.fillStyle = "#3a1f1e";
      ctx.fillRect(38, 58, healthWidth, 18);

      ctx.fillStyle = healthPercent > 0.35 ? "#d73535" : "#ff7a40";
      ctx.fillRect(38, 58, healthWidth * healthPercent, 18);

      ctx.strokeStyle = "#f4f0dc";
      ctx.lineWidth = 2;
      ctx.strokeRect(38, 58, healthWidth, 18);

      ctx.fillStyle = "#f4f0dc";
      ctx.font = "20px Arial";
      ctx.fillText(`Zombies defeated: ${killCount}`, WIDTH - 240, 40);
      ctx.fillText(`Time: ${Math.floor(survivalTime)}s`, WIDTH - 240, 68);
      ctx.fillText(`Best: ${highScore}`, WIDTH - 240, 96);
    }

    function drawStartScreen() {
      drawBackground();

      ctx.fillStyle = "rgba(0, 0, 0, 0.62)";
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      drawNinjaLogo(WIDTH / 2, 235);

      ctx.textAlign = "center";
      ctx.fillStyle = "#f4f0dc";
      ctx.font = "64px Arial";
      ctx.fillText("Ninja Head Survival", WIDTH / 2, 350);

      ctx.font = "28px Arial";
      ctx.fillText("Move with W A S D, arrow keys, or the joystick", WIDTH / 2, 415);
      ctx.fillText("Click or tap the arena to aim and throw", WIDTH / 2, 458);
      ctx.font = "22px Arial";
      ctx.fillText(`Personal best: ${highScore} zombies defeated`, WIDTH / 2, 498);
      ctx.font = "19px Arial";
      ctx.fillText("Touch tip: press ATTACK to target the nearest zombie", WIDTH / 2, 527);

      ctx.fillStyle = "#d73535";
      ctx.font = "34px Arial";
      ctx.fillText("Press SPACE or tap to start", WIDTH / 2, 573);
      ctx.fillStyle = "#b8b5a7";
      ctx.font = "18px Arial";
      ctx.fillText(`Version ${APP_VERSION}`, WIDTH / 2, 755);
      ctx.textAlign = "left";
    }

    function drawGameOverScreen() {
      drawBackground();

      for (const star of stars) star.draw();
      for (const zombie of zombies) zombie.draw();
      if (player) player.draw();

      ctx.fillStyle = "rgba(0, 0, 0, 0.72)";
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      ctx.textAlign = "center";
      ctx.fillStyle = "#d73535";
      ctx.font = "76px Arial";
      ctx.fillText("Game Over", WIDTH / 2, 325);

      ctx.fillStyle = "#f4f0dc";
      ctx.font = "30px Arial";
      ctx.fillText(`You survived ${Math.floor(survivalTime)} seconds`, WIDTH / 2, 395);
      ctx.fillText(`Zombies defeated: ${killCount}`, WIDTH / 2, 438);
      ctx.font = "24px Arial";
      ctx.fillText(`Personal best: ${highScore} zombies defeated`, WIDTH / 2, 482);

      ctx.fillStyle = "#d73535";
      ctx.font = "32px Arial";
      ctx.fillText("Press SPACE or tap to play again", WIDTH / 2, 535);
      ctx.textAlign = "left";
    }

    function drawNinjaLogo(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(2.2, 2.2);
      const logoPlayer = { x: 0, y: 0, radius: 28 };

      ctx.fillStyle = "#070707";
      ctx.beginPath();
      ctx.arc(logoPlayer.x, logoPlayer.y, logoPlayer.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#c91f2f";
      ctx.beginPath();
      ctx.ellipse(0, -10, 27, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#0c0c0c";
      ctx.fillRect(-27, -9, 54, 16);

      ctx.fillStyle = "#c59a72";
      ctx.beginPath();
      ctx.ellipse(0, 4, 18, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#f3ead3";
      ctx.beginPath();
      ctx.arc(-8, 2, 3, 0, Math.PI * 2);
      ctx.arc(8, 2, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function draw() {
      if (state === "start") {
        drawStartScreen();
        return;
      }

      if (state === "gameover") {
        drawGameOverScreen();
        return;
      }

      drawBackground();

      for (const star of stars) {
        star.draw();
      }

      for (const zombie of zombies) {
        zombie.draw();
      }

      player.draw();
      drawHud();
    }

    function gameLoop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000 || 0, 0.05);
      lastTime = timestamp;

      update(dt);
      draw();

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener("keydown", event => {
      const key = event.key.toLowerCase();
      keys[key] = true;

      if (event.code === "Space") {
        event.preventDefault();
        if (state === "start" || state === "gameover") {
          startGame();
        }
      }
    });

    window.addEventListener("keyup", event => {
      keys[event.key.toLowerCase()] = false;
    });

    function throwStarAt(position) {
      if (state !== "playing") return;
      stars.push(new ThrowingStar(player.x, player.y, position.x, position.y));
    }

    function getNearestZombiePosition() {
      if (!zombies.length) return { x: player.x + 1, y: player.y };
      let nearest = zombies[0];
      let nearestDistance = Math.hypot(nearest.x - player.x, nearest.y - player.y);
      for (const zombie of zombies.slice(1)) {
        const distance = Math.hypot(zombie.x - player.x, zombie.y - player.y);
        if (distance < nearestDistance) {
          nearest = zombie;
          nearestDistance = distance;
        }
      }
      return { x: nearest.x, y: nearest.y };
    }

    canvas.addEventListener("pointerdown", event => {
      if (event.pointerType === "mouse" && event.button !== 0) return;
      if (state === "start" || state === "gameover") {
        startGame();
        return;
      }
      if (event.target.closest && event.target.closest(".touch-controls")) return;
      const mouse = getMousePosition(event);
      throwStarAt(mouse);
    });

    let joystickPointer = null;
    function updateJoystick(event) {
      const rect = joystick.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const maxRadius = rect.width * 0.34;
      let dx = event.clientX - centerX;
      let dy = event.clientY - centerY;
      const length = Math.hypot(dx, dy);
      if (length > maxRadius) {
        dx = dx / length * maxRadius;
        dy = dy / length * maxRadius;
      }
      touchMove.x = dx / maxRadius;
      touchMove.y = dy / maxRadius;
      joystickKnob.style.left = `calc(50% + ${dx}px)`;
      joystickKnob.style.top = `calc(50% + ${dy}px)`;
    }

    function resetJoystick() {
      joystickPointer = null;
      touchMove.x = 0;
      touchMove.y = 0;
      joystickKnob.style.left = "50%";
      joystickKnob.style.top = "50%";
    }

    joystick.addEventListener("pointerdown", event => {
      event.preventDefault();
      joystickPointer = event.pointerId;
      joystick.setPointerCapture(event.pointerId);
      updateJoystick(event);
    });
    joystick.addEventListener("pointermove", event => {
      if (event.pointerId === joystickPointer) updateJoystick(event);
    });
    joystick.addEventListener("pointerup", resetJoystick);
    joystick.addEventListener("pointercancel", resetJoystick);
    attackButton.addEventListener("pointerdown", event => {
      event.preventDefault();
      if (state === "start" || state === "gameover") {
        startGame();
      } else {
        throwStarAt(getNearestZombiePosition());
      }
    });

    // Some iOS Safari versions still double-tap zoom on positioned elements,
    // even when their touch-action is none. Game input is handled on pointerdown,
    // so cancel the browser's default action only for a rapid second touch.
    let lastTouchEnd = 0;
    gameShell.addEventListener("touchend", event => {
      const now = performance.now();
      if (lastTouchEnd && now - lastTouchEnd < 350) {
        event.preventDefault();
      }
      lastTouchEnd = now;
    }, { passive: false });

    window.addEventListener("blur", () => {
      for (const key of Object.keys(keys)) keys[key] = false;
      resetJoystick();
    });

    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
    }

    drawStartScreen();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
