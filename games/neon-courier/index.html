<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Neon Courier - a tiny arcade game built with vanilla HTML, CSS, and JavaScript." />
    <title>Neon Courier</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">NIGHT SHIFT // 07</p>
          <h1>Neon Courier</h1>
        </div>
        <div class="scoreboard" aria-label="Game score">
          <div>
            <span>Score</span>
            <strong id="score">0</strong>
          </div>
          <div>
            <span>Best</span>
            <strong id="best">0</strong>
          </div>
        </div>
      </header>

      <section class="game-card">
        <div class="status-row">
          <p id="status">Ready when you are.</p>
          <p class="controls-hint">Move: <kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd></p>
        </div>
        <div class="canvas-wrap">
          <canvas id="game" aria-label="Neon Courier game area"></canvas>
          <div id="overlay" class="overlay">
            <div class="overlay-panel">
              <span class="signal">● SIGNAL LOCKED</span>
              <h2>Deliver the spark.</h2>
              <p>Slide through the city grid, collect energy, and don't hit the falling data blocks.</p>
              <button id="start-button" type="button">Start run</button>
            </div>
          </div>
        </div>
        <div class="mobile-controls" aria-label="Touch controls">
          <button type="button" data-direction="left" aria-label="Move left">←</button>
          <button type="button" data-direction="right" aria-label="Move right">→</button>
        </div>
      </section>

      <footer>
        <span>Built for Global Hack Week</span>
        <span>Vanilla HTML · CSS · JS</span>
      </footer>
    </main>
    <script src="game.js"></script>
  </body>
</html>
