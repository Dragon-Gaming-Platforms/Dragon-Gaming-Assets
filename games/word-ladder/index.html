<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Word Ladder</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:radial-gradient(circle at 50% 0,#1c2536,#080b12 60%);color:#eef;
    font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;display:flex;flex-direction:column;
    align-items:center;min-height:100vh;gap:12px;padding:18px;user-select:none;-webkit-user-select:none}
  h1{margin:4px 0;font-size:clamp(20px,5vw,28px)}
  #goal{font-weight:700;color:#9ad;text-align:center}
  #goal b{letter-spacing:3px;font-size:1.2em;color:#ffd76a}
  #ladder{display:flex;flex-direction:column;gap:6px;align-items:center;min-height:40px}
  .word{letter-spacing:6px;font-size:26px;font-weight:800;padding:4px 14px;border-radius:8px;background:rgba(255,255,255,.06)}
  .word.start{color:#7cf}.word.end{color:#7f8}
  #status{min-height:20px;color:#f5a;font-weight:700;text-align:center}
  .row{display:flex;gap:8px}
  input{letter-spacing:6px;text-transform:uppercase;font-size:22px;font-weight:800;width:150px;text-align:center;
    padding:8px;border-radius:10px;border:2px solid #345;background:#0e1420;color:#fff}
  button{background:#4aa3ff;color:#04152a;border:0;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<h1>Word Ladder</h1>
<div id="goal"></div>
<div id="ladder"></div>
<div class="row"><input id="entry" maxlength="4" autocomplete="off" placeholder="····"><button id="add">Add</button></div>
<div id="status">Change one letter at a time. Every rung must be a real word.</div>
<div class="row"><button id="undo">Undo</button><button id="newG">New Puzzle</button></div>
<script>
const WORDS=("able acid aged also arch area army aunt away back bake ball band bank bard bare barn base bath bead beam bean bear beat beds bell belt bend bent best bill bind bird bite blow blue boat bold bolt bond bone book boot bore born both bowl bran brew brow buck bulk bull burn bush busy cake calf call calm camp cane cape card care carp cart case cash cast cave cell cent char chat chin chip chop city clad clam clap claw clay clip clog club coal coat code coil coin cold colt comb cone cook cool cope copy cord core cork corn cost cove cozy crab crib crop crow cube curb cure curl cash dale damp dare dark dart dash date dawn dead deaf deal dean dear debt deck deed deep deer dell dent desk dial dice diet dime dine ding dirt dish dive dock does dole doll dome done doom door dose dove down drag draw drew drip drop drum dual duck dune dusk dust duty each earl earn ease east easy edge fact fade fail fair fall fame fang farm fast fate fear feat feed feel fell felt fern file fill film find fine fire firm fish fist five flag flat flaw flea fled flee flew flip flow foam foes fold folk fond font food fool foot ford fore fork form fort foul four fowl free frog from fuel full fund fury fuse gain gale game gang gap gape gate gave gaze gear gems germ gift gild girl give glad glow glue goal goat goes gold golf gone good goof gore gown grab gram gray grew grid grim grin grip grow gulf gull gush hail hair half hall halt hand hang hard hare harm harp hart hash haste hate haul have hawk haze head heal heap hear heat heed heel held hell helm help herb herd here hero hers hide high hike hill hilt hint hire hiss hive hoax hold hole holy home hone hood hook hoop hope horn hose host hour howl huge hull hump hung hunt hurt hush hymn idea idle inch iron isle itch jade jail jazz jeep jest jibe join joke jolt jump junk jury just keel keen keep kept kick kiln kind king kiss kite knee knew knit knob knot know lace lack lady laid lair lake lamb lame lamp land lane lard lark lash last late lawn l const DICT=new Set(WORDS);
const PUZZLES=[['COLD','WARM'],['HEAD','TAIL'],['FISH','GOLD'],['LOVE','HATE'],['STOP','GOLD']];
let start,end,ladder,over;
function init(){
  const p=PUZZLES[Math.floor(Math.random()*PUZZLES.length)];
  start=p[0];end=p[1];ladder=[start];over=false;
  document.getElementById('goal').innerHTML=`Turn <b>${start}</b> into <b>${end}</b>`;
  document.getElementById('status').textContent='Change one letter at a time. Every rung must be a real word.';
  document.getElementById('entry').value='';render();
}
function render(){
  const L=document.getElementById('ladder');L.innerHTML='';
  ladder.forEach((w,i)=>{const d=document.createElement('div');
    d.className='word'+(i===0?' start':'')+(w===end?' end':'');d.textContent=w;L.appendChild(d);});
}
function diffOne(a,b){let d=0;for(let i=0;i<4;i++)if(a[i]!==b[i])d++;return d===1;}
function add(){
  if(over)return;
  const w=document.getElementById('entry').value.trim().toLowerCase();
  const st=document.getElementById('status');
  if(w.length!==4){st.textContent='Enter a 4-letter word.';return;}
  const prev=ladder[ladder.length-1].toLowerCase();
  if(!diffOne(prev,w)){st.textContent='Must change exactly one letter from the previous word.';return;}
  if(!DICT.has(w)){st.textContent=`"${w.toUpperCase()}" is not in the word list.`;return;}
  if(ladder.map(x=>x.toLowerCase()).includes(w)){st.textContent='Already used that word.';return;}
  ladder.push(w.toUpperCase());document.getElementById('entry').value='';render();
  if(w.toUpperCase()===end){over=true;st.textContent=`🎉 Reached ${end} in ${ladder.length-1} steps!`;}
  else st.textContent='Good — keep going.';
}
document.getElementById('add').onclick=add;
document.getElementById('entry').addEventListener('keydown',e=>{if(e.key==='Enter')add();});
document.getElementById('undo').onclick=()=>{if(!over&&ladder.length>1){ladder.pop();render();}};
document.getElementById('newG').onclick=init;
init();
</script>
</body>
</html>
