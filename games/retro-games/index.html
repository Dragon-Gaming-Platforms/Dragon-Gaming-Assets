<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retro Arcade</title>
<style>
  html,body{margin:0;padding:0;background:#0b0e13;color:#dfe6ee;font-family:ui-monospace,Menlo,Consolas,monospace}
  .wrap{max-width:720px;margin:0 auto;padding:48px 20px}
  h1{font-size:34px;letter-spacing:.18em;text-transform:uppercase;margin:0 0 6px}
  p.sub{color:#8b98a9;margin:0 0 34px;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  a.card{display:block;background:#11161f;border:1px solid #232c3a;border-radius:10px;overflow:hidden;text-decoration:none;color:inherit;transition:border-color .15s, transform .15s}
  a.card:hover{border-color:#5fd0ff;transform:translateY(-2px)}
  a.card img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:#000}
  .card span{display:block;padding:14px 16px;font-size:14px;letter-spacing:.1em;text-transform:uppercase}
  footer{margin-top:36px;color:#5a6779;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  @media (max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Retro Arcade</h1>
  <p class="sub">Four classics &middot; plain JavaScript</p>
  <div class="grid">
    <a class="card" href="asteroids/"><img src="asteroids/screenshot.png" alt="Asteroids"><span>Asteroids</span></a>
    <a class="card" href="lunar-lander/"><img src="lunar-lander/screenshot.png" alt="Lunar Lander"><span>Lunar Lander</span></a>
    <a class="card" href="snake/"><img src="snake/screenshot.png" alt="Snake"><span>Snake</span></a>
    <a class="card" href="space-invaders/"><img src="space-invaders/screenshot.png" alt="Space Invaders"><span>Space Invaders</span></a>
  </div>
  <footer>Mary Rose Cook &middot; MIT license</footer>
</div>
</body>
</html>
