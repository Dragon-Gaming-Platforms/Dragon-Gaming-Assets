<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Devourer - Arcade Phantasm</title>
    <meta name="description" content="Devourer, an Arcade Phantasm game by Cursed Entertainment: you're a tiny black hole. Eat rocks, moons, stars and whole planetary systems, but bigger is slower and what you've swallowed follows you.">
    <link rel="icon" type="image/png" href="images/cursed-logo.png">
    <link rel="stylesheet" href="site/style.css">
</head>

<body>
    <canvas id="game"></canvas>

    <div id="splash">
        <h1 class="title">DEVOURER</h1>
        <p class="tag">An Arcade Phantasm game</p>
        <img class="cursed-logo" src="images/cursed-logo.png" alt="Cursed Entertainment">
        <p class="copyright">&copy; Cursed Entertainment 2026</p>
        <p class="press">Press any key or tap to start</p>
        <p class="keys">Arrows / WASD or mouse move &middot; Space power &middot; Q / E or 1-4 form &middot; P pause &middot; M mute</p>
    </div>

    <div id="touch">
        <button id="tPower" type="button">POWER</button>
        <button id="tForm" type="button">FORM</button>
        <button id="tPause" type="button">II</button>
    </div>

    <script src="site/sfx.js"></script>
    <script src="site/game.js"></script>
</body>

</html>
