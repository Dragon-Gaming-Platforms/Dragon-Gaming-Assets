<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Gomoku</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(circle at 50% -10%,#2a2036,#120e18 60%);color:#eee;
    font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;display:flex;flex-direction:column;
    align-items:center;justify-content:center;min-height:100vh;gap:12px;padding:12px;user-select:none;-webkit-user-select:none}
  h1{margin:0;font-size:clamp(20px,5vw,30px)}
  #status{min-height:22px;font-size:15px;color:#c9a3ff;font-weight:700}
  #board{background:#d9a566;border:6px solid #a9702f;border-radius:6px;
    box-shadow:0 14px 40px rgba(0,0,0,.55);touch-action:manipulation;cursor:pointer}
  .row{display:flex;gap:10px;align-items:center}
  button,select{background:#b48cff;color:#1a0f2b;border:0;border-radius:10px;padding:10px 18px;font-size:15px;font-weight:800;cursor:pointer}
  select{background:rgba(255,255,255,.1);color:#eee}
</style>
</head>
<body>
<h1>Gomoku</h1>
<div id="status">Your move (black) — get five in a row</div>
<canvas id="board"></canvas>
<div class="row">
  <button id="newGame">New Game</button>
  <select id="level"><option value="1">Easy</option><option value="2" selected>Normal</option><option value="3">Hard</option></select>
</div>
<script>
const N=15;const cv=document.getElementById('board'),ctx=cv.getContext('2d');
let cell,board,turn,gameOver;
function size(){cell=Math.floor(Math.min(window.innerWidth*0.92,window.innerHeight*0.62,540)/N);cv.width=cv.height=cell*N;draw();}
function init(){board=Array.from({length:N},()=>Array(N).fill(0));turn=1;gameOver=false;
  document.getElementById('status').textContent='Your move (black) — get five in a row';size();}
function draw(){
  ctx.fillStyle='#d9a566';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.strokeStyle='#5a3a18';ctx.lineWidth=1;
  const o=cell/2;
  for(let i=0;i<N;i++){ctx.beginPath();ctx.moveTo(o,o+i*cell);ctx.lineTo(o+(N-1)*cell,o+i*cell);ctx.stroke();
    ctx.beginPath();ctx.moveTo(o+i*cell,o);ctx.lineTo(o+i*cell,o+(N-1)*cell);ctx.stroke();}
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(board[r][c]){
    ctx.beginPath();ctx.arc(o+c*cell,o+r*cell,cell*0.42,0,7);
    ctx.fillStyle=board[r][c]===1?'#12151f':'#f4f7ff';ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.35)';ctx.stroke();
  }
}
cv.addEventListener('click',e=>{
  if(gameOver||turn!==1)return;
  const rect=cv.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(cv.width/rect.width),y=(e.clientY-rect.top)*(cv.height/rect.height);
  const c=Math.round(x/cell-0.5),r=Math.round(y/cell-0.5);
  if(r<0||c<0||r>=N||c>=N||board[r][c])return;
  place(r,c,1);
  if(check(r,c,1)){return end('🎉 You win!');}
  if(full())return end("It's a draw");
  turn=2;draw();document.getElementById('status').textContent='CPU thinking…';
  setTimeout(cpu,250);
});
function place(r,c,p){board[r][c]=p;draw();}
function cpu(){
  const mv=bestMove();place(mv[0],mv[1],2);
  if(check(mv[0],mv[1],2))return end('CPU wins — try again');
  if(full())return end("It's a draw");
  turn=1;document.getElementById('status').textContent='Your move (black)';
}
function full(){return board.every(row=>row.every(v=>v));}
const DIRS=[[0,1],[1,0],[1,1],[1,-1]];
function check(r,c,p){
  for(const[dr,dc]of DIRS){let n=1;
    for(let s=1;s<5;s++){const rr=r+dr*s,cc=c+dc*s;if(rr<0||cc<0||rr>=N||cc>=N||board[rr][cc]!==p)break;n++;}
    for(let s=1;s<5;s++){const rr=r-dr*s,cc=c-dc*s;if(rr<0||cc<0||rr>=N||cc>=N||board[rr][cc]!==p)break;n++;}
    if(n>=5)return true;}
  return false;
}
function scorePoint(r,c,p){
  // heuristic: sum of line potentials
  let total=0;
  for(const[dr,dc]of DIRS){
    let count=1,openEnds=0;
    let s=1;while(s<5){const rr=r+dr*s,cc=c+dc*s;if(rr<0||cc<0||rr>=N||cc>=N)break;if(board[rr][cc]===p){count++;s++;}else{if(board[rr][cc]===0)openEnds++;break;}}
    s=1;while(s<5){const rr=r-dr*s,cc=c-dc*s;if(rr<0||cc<0||rr>=N||cc>=N)break;if(board[rr][cc]===p){count++;s++;}else{if(board[rr][cc]===0)openEnds++;break;}}
    if(count>=5)total+=1000000;
    else total+=Math.pow(count,4)*(openEnds+1)+openEnds;
  }
  return total;
}
function bestMove(){
  const level=parseInt(document.getElementById('level').value);
  const cand=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!board[r][c]&&hasNeighbor(r,c))cand.push([r,c]);
  if(!cand.length)return[7,7];
  let best=cand[0],bestScore=-Infinity;
  for(const[r,c]of cand){
    const atk=scorePoint(r,c,2);       // CPU offense
    const def=scorePoint(r,c,1)*(level>=2?1.1:0.7); // block player
    let s=atk+def;
    if(level<3)s+=Math.random()*((4-level)*40);
    if(s>bestScore){bestScore=s;best=[r,c];}
  }
  return best;
}
function hasNeighbor(r,c){
  for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){const rr=r+dr,cc=c+dc;
    if(rr>=0&&cc>=0&&rr<N&&cc<N&&board[rr][cc])return true;}
  return false;
}
function end(msg){gameOver=true;document.getElementById('status').textContent=msg;}
document.getElementById('newGame').onclick=init;
document.getElementById('level').onchange=init;
window.addEventListener('resize',size);
init();
</script>
</body>
</html>
