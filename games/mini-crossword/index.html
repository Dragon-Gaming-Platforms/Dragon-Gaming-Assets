<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Mini Crossword</title>
<style>
  *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#101418;color:#eef;
    font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px;user-select:none;-webkit-user-select:none}
  h1{margin:2px 0;font-size:clamp(18px,5vw,24px)}
  #status{min-height:18px;font-weight:700;color:#ffe08a;text-align:center;max-width:440px}
  #grid{display:grid;grid-template-columns:repeat(5,52px);gap:3px;background:#333;padding:3px;border-radius:6px}
  .cell{width:52px;height:52px;background:#fff;color:#111;position:relative;display:flex;align-items:center;justify-content:center;
    font-size:26px;font-weight:800;text-transform:uppercase;cursor:pointer}
  .cell.sel{background:#ffe08a}
  .cell.word{background:#cfe6ff}
  .cell.sel.word{background:#ffd24a}
  .num{position:absolute;top:1px;left:3px;font-size:10px;font-weight:700;color:#555}
  .cell.ok{color:#0a8a2a}
  .clues{display:flex;gap:22px;max-width:480px;flex-wrap:wrap;font-size:13px}
  .clues h3{margin:4px 0;color:#9ad}
  .clues div{margin:2px 0;cursor:pointer}
  .clues div.on{color:#ffd24a;font-weight:700}
  #kb{display:flex;flex-wrap:wrap;gap:4px;max-width:430px;justify-content:center}
  #kb button{width:36px;height:40px;font-weight:800;background:#26303a;color:#eef;border:0;border-radius:6px}
  #kb button.wide{width:80px}
  .top button{background:#ffcc33;color:#20150a;border:0;border-radius:9px;padding:8px 14px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<h1>Mini Crossword</h1>
<div id="status">Fill the 5×5 grid. Tap a clue or a square to start typing.</div>
<div id="grid"></div>
<div class="top"><button id="check">Check</button> <button id="reveal">Reveal</button></div>
<div class="clues">
  <div><h3>Across</h3><div id="acl"></div></div>
  <div><h3>Down</h3><div id="dcl"></div></div>
</div>
<div id="kb"></div>
<script>
const SOL=["HEART","EMBER","ABUSE","RESIN","TREND"];
const ACROSS=[["1","Core of affection","HEART"],["6","Glowing coal","EMBER"],["7","Mistreat","ABUSE"],["8","Tree sap product","RESIN"],["9","Popular direction","TREND"]];
const DOWN=[["1","Feeling deeply","HEART?"],];
// build down answers from solution columns
const downWords=[];for(let c=0;c<5;c++){let w='';for(let r=0;r<5;r++)w+=SOL[r][c];downWords.push(w);}
const DOWNCLUES=[["1","Feeling / grieve",downWords[0]],["2","Foe's opposite? no—stress out",downWords[1]],["3","Craft / creative skill",downWords[2]],["4","Not present? use / spend",downWords[3]],["5","Send / mail out",downWords[4]]];
let entry=Array.from({length:5},()=>Array(5).fill(''));
let sel={r:0,c:0},dir='A';
const gridEl=document.getElementById('grid');
function numAt(r,c){
  // across start at c==0, down start at r==0. Numbering across rows then... use standard: number cell if starts across or down
  const startA=(c===0);const startD=(r===0);
  if(startA||startD){return r*5+c< 0?'' :cellNumber(r,c);}
  return '';
}
function cellNumber(r,c){
  // simple: rows are across clues 1,6,7,8,9 for r0..4; cols down 1..5 for c0..4
  // return the down number for top row, across number for first col
  if(r===0)return String(c+1);
  if(c===0)return ['1','6','7','8','9'][r];
  return '';
}
function render(){
  gridEl.innerHTML='';
  for(let r=0;r<5;r++)for(let c=0;c<5;c++){
    const cell=document.createElement('div');cell.className='cell';
    if(sel.r===r&&sel.c===c)cell.classList.add('sel');
    else if(dir==='A'&&sel.r===r)cell.classList.add('word');
    else if(dir==='D'&&sel.c===c)cell.classList.add('word');
    const n=cellNumber(r,c);if(n){const s=document.createElement('span');s.className='num';s.textContent=n;cell.appendChild(s);}
    const t=document.createTextNode(entry[r][c]||'');cell.appendChild(t);
    cell.onclick=()=>{if(sel.r===r&&sel.c===c)dir=dir==='A'?'D':'A';sel={r,c};render();};
    gridEl.appendChild(cell);
  }
  renderClues();
}
function renderClues(){
  const a=document.getElementById('acl');a.innerHTML='';
  ACROSS.forEach((cl,i)=>{const d=document.createElement('div');d.textContent=cl[0]+'. '+cl[1];
    if(dir==='A'&&sel.r===i)d.className='on';d.onclick=()=>{dir='A';sel={r:i,c:0};render();};a.appendChild(d);});
  const dd=document.getElementById('dcl');dd.innerHTML='';
  DOWNCLUES.forEach((cl,i)=>{const d=document.createElement('div');d.textContent=cl[0]+'. '+cl[1];
    if(dir==='D'&&sel.c===i)d.className='on';d.onclick=()=>{dir='D';sel={r:0,c:i};render();};dd.appendChild(d);});
}
function type(ch){
  entry[sel.r][sel.c]=ch;
  if(dir==='A'&&sel.c<4)sel.c++;else if(dir==='D'&&sel.r<4)sel.r++;
  render();
}
function back(){
  if(entry[sel.r][sel.c]){entry[sel.r][sel.c]='';}
  else{if(dir==='A'&&sel.c>0)sel.c--;else if(dir==='D'&&sel.r>0)sel.r--;entry[sel.r][sel.c]='';}
  render();
}
document.getElementById('check').onclick=()=>{
  let done=true,wrong=false;
  for(let r=0;r<5;r++)for(let c=0;c<5;c++){if(!entry[r][c])done=false;else if(entry[r][c]!==SOL[r][c])wrong=true;}
  document.getElementById('status').textContent=!done?'Keep going — grid not full yet.':wrong?'Not quite — some letters are wrong.':'🎉 Solved! Great work.';
};
document.getElementById('reveal').onclick=()=>{for(let r=0;r<5;r++)for(let c=0;c<5;c++)entry[r][c]=SOL[r][c];render();document.getElementById('status').textContent='Answers revealed.';};
window.addEventListener('keydown',e=>{
  if(/^[a-zA-Z]$/.test(e.key)){type(e.key.toUpperCase());e.preventDefault();}
  else if(e.key==='Backspace'){back();e.preventDefault();}
  else if(e.key==='ArrowRight'){if(sel.c<4)sel.c++;render();}
  else if(e.key==='ArrowLeft'){if(sel.c>0)sel.c--;render();}
  else if(e.key==='ArrowDown'){if(sel.r<4)sel.r++;render();}
  else if(e.key==='ArrowUp'){if(sel.r>0)sel.r--;render();}
});
const kb=document.getElementById('kb');
'QWERTYUIOP ASDFGHJKL ZXCVBNM'.split(' ').forEach(row=>{
  row.split('').forEach(ch=>{const b=document.createElement('button');b.textContent=ch;b.onclick=()=>type(ch);kb.appendChild(b);});
});
const del=document.createElement('button');del.textContent='⌫';del.className='wide';del.onclick=back;kb.appendChild(del);
render();
</script>
</body>
</html>
