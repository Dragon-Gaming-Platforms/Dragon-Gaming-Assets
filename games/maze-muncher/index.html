<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Maze Muncher</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:#05050f;color:#eef;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:8px;padding:10px;user-select:none;-webkit-user-select:none}
  h1{margin:0;font-size:clamp(18px,5vw,26px)}
  #hud{display:flex;gap:22px;font-weight:800;color:#ffd76a}
  canvas{background:#000;border-radius:8px;touch-action:none;max-width:96vw;height:auto}
  #status{min-height:18px;color:#9ad;font-weight:700;text-align:center}
  .ctrls{display:grid;grid-template-columns:repeat(3,52px);gap:5px;justify-content:center}
  .ctrls button{background:#223;color:#fff;border:0;border-radius:8px;padding:12px 0;font-weight:800;cursor:pointer}
  .hint{font-size:12px;opacity:.7;text-align:center}
</style>
</head>
<body>
<h1>Maze Muncher</h1>
<div id="hud"><span>Score: <b id="score">0</b></span><span>Lives: <b id="lives">3</b></span><span>Level: <b id="level">1</b></span></div>
<canvas id="c" width="360" height="360"></canvas>
<div id="status">Munch all the dots. Grab a power pellet to chase the ghosts!</div>
<div class="ctrls"><span></span><button id="up">▲</button><span></span><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button></div>
<div class="hint">Arrow keys / WASD to move (or the buttons)</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=15,Hh=15,CELL=cv.width/W;
// wall if border or interior even/even pillar -> guaranteed fully connected corridors
function isWall(r,c){return r===0||c===0||r===Hh-1||c===W-1||(r%2===0&&c%2===0);}
let dots,pellets,player,ghosts,score,lives,level,frightened,over,win,step,keys,nextDir;
function freshDots(){dots=new Set();pellets=new Set();
  for(let r=1;r<Hh-1;r++)for(let c=1;c<W-1;c++)if(!isWall(r,c))dots.add(r+','+c);
  // player + ghost home cells cleared of dots
  const clear=['7,7','7,6','7,8','6,7','8,7'];clear.forEach(k=>dots.delete(k));
  [[1,1],[1,W-2],[Hh-2,1],[Hh-2,W-2]].forEach(([r,c])=>{if(!isWall(r,c)){pellets.add(r+','+c);dots.delete(r+','+c);}});
}
function init(){score=0;lives=3;level=1;over=false;startLevel();}
function startLevel(){freshDots();win=false;frightened=0;
  player={r:7,c:7,dir:[0,0]};nextDir=[0,0];keys={};
  ghosts=[{r:1,c:7,color:'#ff5da2',dir:[0,1]},{r:13,c:7,color:'#5de0ff',dir:[0,-1]},{r:7,c:1,color:'#ffb84d',dir:[1,0]}];
  if(level>=2)ghosts.push({r:7,c:13,color:'#7cff7c',dir:[-1,0]});
  updateHud();document.getElementById('status').textContent='Munch all the dots!';}
function updateHud(){document.getElementById('score').textContent=score;document.getElementById('lives').textContent=lives;document.getElementById('level').textContent=level;}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  const map={arrowup:[-1,0],arrowdown:[1,0],arrowleft:[0,-1],arrowright:[0,1],w:[-1,0],s:[1,0],a:[0,-1],d:[0,1]};
  if(map[k]){nextDir=map[k];e.preventDefault();}});
function dirBtn(id,d){const el=document.getElementById(id);const set=e=>{nextDir=d;e.preventDefault();};
  el.addEventListener('click',set);el.addEventListener('touchstart',set,{passive:false});}
dirBtn('up',[-1,0]);dirBtn('down',[1,0]);dirBtn('left',[0,-1]);dirBtn('right',[0,1]);
function canMove(r,c,d){const nr=r+d[0],nc=c+d[1];return !isWall(nr,nc);}
let acc=0,last=0;
function tickLogic(){
  // player
  if((nextDir[0]||nextDir[1])&&canMove(player.r,player.c,nextDir))player.dir=nextDir.slice();
  if(canMove(player.r,player.c,player.dir)){player.r+=player.dir[0];player.c+=player.dir[1];}
  const pk=player.r+','+player.c;
  if(dots.has(pk)){dots.delete(pk);score+=10;updateHud();}
  if(pellets.has(pk)){pellets.delete(pk);score+=50;frightened=28;updateHud();}
  if(dots.size===0&&pellets.size===0){win=true;level++;setTimeout(startLevel,800);
    document.getElementById('status').textContent='Level clear! 🎉';return;}
  // ghosts
  if(frightened>0)frightened--;
  ghosts.forEach(g=>{
    const opts=[[-1,0],[1,0],[0,-1],[0,1]].filter(d=>canMove(g.r,g.c,d)&&!(d[0]===-g.dir[0]&&d[1]===-g.dir[1]));
    const choices=opts.length?opts:[[-g.dir[0],-g.dir[1]]];
    let best=choices[0],bestScore=frightened>0?-1:1e9;
    choices.forEach(d=>{const nr=g.r+d[0],nc=g.c+d[1];const dist=Math.abs(nr-player.r)+Math.abs(nc-player.c);
      if(frightened>0){if(dist>bestScore){bestScore=dist;best=d;}}else{if(dist<bestScore){bestScore=dist;best=d;}}});
    if(Math.random()<0.2&&choices.length)best=choices[Math.floor(Math.random()*choices.length)];
    g.dir=best;g.r+=best[0];g.c+=best[1];
  });
  checkGhosts();
}
function checkGhosts(){
  ghosts.forEach(g=>{if(g.r===player.r&&g.c===player.c){
    if(frightened>0){g.r=7;g.c=7;g.dir=[0,-1];score+=200;updateHud();}
    else loseLife();
  }});
}
function loseLife(){lives--;updateHud();
  if(lives<=0){over=true;document.getElementById('status').textContent=`Game over! Score ${score}. Tap a direction to restart.`;
    const rst=()=>{init();document.removeEventListener('keydown',rk);};
    const rk=(e)=>{rst();};document.addEventListener('keydown',rk,{once:true});return;}
  player={r:7,c:7,dir:[0,0]};nextDir=[0,0];frightened=0;
  ghosts.forEach((g,i)=>{const home=[[1,7],[13,7],[7,1],[7,13]][i];g.r=home[0];g.c=home[1];});
  document.getElementById('status').textContent='Caught! Careful now.';
}
function loop(t){
  requestAnimationFrame(loop);
  if(over||win){draw();return;}
  const now=t||0;if(!last)last=now;acc+=now-last;last=now;
  const stepMs=Math.max(110,170-level*8);
  if(acc>=stepMs){acc=0;tickLogic();}
  draw();
}
function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  for(let r=0;r<Hh;r++)for(let c=0;c<W;c++){
    if(isWall(r,c)){ctx.fillStyle='#1a1a5e';ctx.fillRect(c*CELL+1,r*CELL+1,CELL-2,CELL-2);}
  }
  ctx.fillStyle='#ffd76a';dots.forEach(k=>{const[r,c]=k.split(',').map(Number);ctx.beginPath();ctx.arc(c*CELL+CELL/2,r*CELL+CELL/2,2,0,7);ctx.fill();});
  pellets.forEach(k=>{const[r,c]=k.split(',').map(Number);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(c*CELL+CELL/2,r*CELL+CELL/2,5,0,7);ctx.fill();});
  // player
  const px=player.c*CELL+CELL/2,py=player.r*CELL+CELL/2;
  ctx.fillStyle='#ffe14d';ctx.beginPath();ctx.arc(px,py,CELL/2-2,0.25*Math.PI,1.75*Math.PI);ctx.lineTo(px,py);ctx.fill();
  // ghosts
  ghosts.forEach(g=>{const gx=g.c*CELL+CELL/2,gy=g.r*CELL+CELL/2;
    ctx.fillStyle=frightened>0?(frightened<8&&Math.floor(frightened*2)%2?'#fff':'#3030c0'):g.color;
    ctx.beginPath();ctx.arc(gx,gy-1,CELL/2-3,Math.PI,0);ctx.lineTo(gx+CELL/2-3,gy+CELL/2-3);ctx.lineTo(gx-CELL/2+3,gy+CELL/2-3);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(gx-3,gy-2,2,0,7);ctx.arc(gx+3,gy-2,2,0,7);ctx.fill();});
}
init();loop();
</script>
</body>
</html>
